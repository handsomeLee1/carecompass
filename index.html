<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어컴퍼스 - 전국 장기요양기관 찾기</title>
<meta name="description" content="전국 요양원, 주간보호센터, 방문요양, 복지용구 기관 검색. 국민건강보험공단 공공데이터 기반.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e1d5b4a27e7f22ebb3e9c5e160db1bfa&libraries=services&onload=initMap"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;color:#222;background:#f5f5f5;font-size:15px}

/* 상단 네비 - full width 다크 */
.topnav{background:#1a1a1a;width:100%;position:sticky;top:0;z-index:100}
.topnav-inner{max-width:1200px;margin:0 auto;height:44px;display:flex;align-items:center;padding:0 16px;gap:24px}
.logo{color:#4ade80;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.logo span{color:#fff}
.nav-links{display:flex;gap:20px;flex:1}
.nav-links a{color:#ccc;font-size:14px;font-weight:400;text-decoration:none;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{color:#4ade80}
.nav-right{color:#777;font-size:12px;white-space:nowrap}

/* 가운데 정렬 래퍼 */
.wrapper{max-width:1200px;margin:0 auto;background:#fff;min-height:calc(100vh - 44px)}

/* 검색 영역 */
.search-area{background:#1D9E75;padding:14px 16px}
.search-inputs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.search-inputs select,
.search-inputs input[type=text]{height:36px;padding:0 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:'Noto Sans KR',sans-serif;background:#fff;color:#333;flex:1;min-width:90px}
.search-inputs select:focus,
.search-inputs input:focus{outline:none;border-color:#9FE1CB}
.search-btn{height:36px;padding:0 18px;background:#085041;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
.search-btn:hover{background:#063d30}
.search-tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab-btn{padding:6px 12px;font-size:13px;border:1px solid rgba(255,255,255,0.4);border-radius:4px;color:#fff;background:rgba(255,255,255,0.1);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.tab-btn.active{background:#fff;color:#1D9E75;font-weight:600;border-color:#fff}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.2)}

/* 3단 레이아웃 */
.three-col{display:flex;min-height:calc(100vh - 44px - 100px)}

/* 좌 사이드바 */
.sidebar-left{width:120px;flex-shrink:0;background:#f8f8f8;border-right:1px solid #e8e8e8;padding:12px 0}
.side-title{font-size:11px;color:#999;padding:0 12px 8px;font-weight:500;letter-spacing:0.5px;border-bottom:1px solid #eee;margin-bottom:4px}
.side-item{display:block;padding:9px 12px;font-size:13px;color:#444;cursor:pointer;border-left:3px solid transparent;line-height:1.3;width:100%;text-align:left;background:none;border-top:none;border-right:none;border-bottom:none;font-family:'Noto Sans KR',sans-serif}
.side-item:hover{background:#f0f0f0;color:#1D9E75}
.side-item.active{color:#1D9E75;font-weight:600;border-left:3px solid #1D9E75;background:#f0faf5}

/* 중앙 메인 */
.main-center{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid #e8e8e8}

/* 결과 헤더 */
.result-header{padding:10px 14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;background:#fff;flex-shrink:0}
.result-count{font-size:14px;color:#333}
.result-count strong{font-weight:600;color:#1D9E75;font-size:15px}
.result-sort select{height:32px;padding:0 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;color:#555;background:#fff;font-family:'Noto Sans KR',sans-serif}

/* 목록+지도 영역 */
.content-area{display:flex;flex:1;overflow:hidden;height:calc(100vh - 44px - 100px - 45px)}

/* 목록 */
.list-area{width:300px;flex-shrink:0;overflow-y:auto;border-right:1px solid #eee;display:flex;flex-direction:column}
.list-area::-webkit-scrollbar{width:4px}
.list-area::-webkit-scrollbar-thumb{background:#d0e8dc;border-radius:4px}
.list-scroll{flex:1}
.inst-card{padding:13px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.1s}
.inst-card:hover{background:#f8fffe}
.inst-card.active{background:#f0faf5;border-left:3px solid #1D9E75;padding-left:11px}
.inst-badge{display:inline-block;background:#e8f5ee;color:#085041;font-size:12px;padding:2px 8px;border-radius:3px;margin-bottom:6px;font-weight:500}
.inst-name{font-size:15px;font-weight:600;color:#222;margin-bottom:5px;line-height:1.3}
.inst-addr{font-size:13px;color:#666;margin-bottom:3px;line-height:1.5}
.inst-tel{font-size:13px;color:#666}
.ad-slot-list{padding:10px 14px;background:#f9f9f9;border-bottom:1px solid #eee;text-align:center;font-size:11px;color:#bbb;min-height:60px;display:flex;align-items:center;justify-content:center}
.pagination{padding:10px;border-top:1px solid #eee;display:flex;justify-content:center;gap:3px;flex-shrink:0}
.page-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid #ddd;border-radius:4px;font-size:13px;cursor:pointer;color:#666;background:#fff}
.page-btn.active{background:#1D9E75;color:#fff;border-color:#1D9E75}
.page-btn:hover:not(.active):not(.disabled){border-color:#1D9E75;color:#1D9E75}
.page-btn.disabled{opacity:0.35;cursor:default;pointer-events:none}

/* 지도 */
.map-area{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
.map-popup{display:none;position:absolute;bottom:16px;right:16px;width:230px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;z-index:10;box-shadow:0 2px 16px rgba(0,0,0,0.1)}
.map-popup.show{display:block}
.popup-close{position:absolute;top:10px;right:10px;font-size:14px;cursor:pointer;color:#aaa;background:none;border:none;line-height:1}
.popup-close:hover{color:#555}
.popup-badge{display:inline-block;background:#e8f5ee;color:#085041;font-size:11px;padding:2px 8px;border-radius:3px;margin-bottom:6px}
.popup-name{font-size:15px;font-weight:600;color:#222;margin-bottom:5px}
.popup-addr{font-size:13px;color:#666;margin-bottom:4px;line-height:1.5}
.popup-tel{font-size:13px;color:#666;margin-bottom:10px}
.popup-btn{display:block;width:100%;height:36px;background:#1D9E75;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.popup-btn:hover{background:#085041}

/* 우 사이드바 */
.sidebar-right{width:160px;flex-shrink:0;background:#f8f8f8;padding:12px;display:flex;flex-direction:column;gap:8px}
.ad-label{font-size:11px;color:#bbb;text-align:center}
.ad-block{background:#fff;border:1px solid #e0e0e0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:11px;text-align:center}
.ad-block-lg{height:280px}
.ad-block-md{height:120px}

/* 상세페이지 */
.detail-wrap{display:none;flex:1;overflow-y:auto;background:#fff}
.detail-wrap.show{display:block}
.detail-inner{max-width:680px;margin:0 auto;padding:24px 20px}
.detail-back{display:inline-flex;align-items:center;gap:6px;border:1px solid #ddd;border-radius:4px;padding:7px 14px;font-size:14px;color:#555;cursor:pointer;margin-bottom:20px;background:#fff;font-family:'Noto Sans KR',sans-serif}
.detail-back:hover{background:#f5f5f5}
.detail-badge{display:inline-block;background:#e8f5ee;color:#085041;font-size:13px;padding:3px 10px;border-radius:3px;margin-bottom:8px}
.detail-name{font-size:22px;font-weight:600;color:#222;margin-bottom:20px}
.detail-section{margin-bottom:24px}
.detail-section h3{font-size:15px;font-weight:600;color:#1D9E75;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e8f5ee}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:#f8fffe;border:1px solid #e8f5ee;border-radius:4px;padding:12px}
.info-item .lbl{font-size:12px;color:#888;margin-bottom:4px}
.info-item .val{font-size:14px;font-weight:500;color:#222}
.staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.staff-item{background:#f8fffe;border:1px solid #e8f5ee;border-radius:4px;padding:10px;text-align:center}
.staff-num{font-size:20px;font-weight:600;color:#1D9E75}
.staff-name{font-size:12px;color:#888;margin-top:2px}
.cap-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cap-bar-bg{flex:1;background:#eee;border-radius:4px;height:20px;overflow:hidden}
.cap-bar-fill{height:100%;background:#1D9E75;border-radius:4px}
.cap-lbl{font-size:13px;color:#555;min-width:90px}
.info-table{width:100%;border-collapse:collapse;font-size:14px}
.info-table th{background:#f0faf5;color:#1D9E75;padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid #e8f5ee}
.info-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5;color:#555}
#detailMap{width:100%;height:260px;border-radius:6px;border:1px solid #ddd;margin-top:12px}
.loading-msg{text-align:center;padding:48px;color:#1D9E75;font-size:15px}
.empty-state{text-align:center;padding:48px 20px;color:#bbb;font-size:15px;line-height:2}

/* 반응형 */
@media(max-width:1024px){
  .sidebar-right{display:none}
}
@media(max-width:768px){
  .sidebar-left{display:none}
  .nav-links a:not(.active){display:none}
  .nav-right{display:none}
  .content-area{flex-direction:column;height:auto}
  .list-area{width:100%;height:auto;border-right:none;border-bottom:1px solid #eee}
  .map-area{height:300px}
  .info-grid{grid-template-columns:1fr}
  .staff-grid{grid-template-columns:repeat(2,1fr)}
  .search-inputs select,.search-inputs input{min-width:80px}
  .three-col{flex-direction:column}
  .main-center{border-right:none}
  /* 모바일 카테고리 탭 */
  .mobile-cats{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;background:#f8f8f8;border-bottom:1px solid #eee}
  .mobile-cats::-webkit-scrollbar{display:none}
  .mobile-cat-btn{padding:5px 12px;font-size:13px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#555;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
  .mobile-cat-btn.active{background:#1D9E75;color:#fff;border-color:#1D9E75}
}
@media(min-width:769px){
  .mobile-cats{display:none}
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="logo" onclick="showMain()">Care<span>Compass</span></div>
    <div class="nav-links">
      <a href="#" class="active" onclick="showMain()">기관찾기</a>
      <a href="#">비용계산기</a>
      <a href="#">장기요양 안내</a>
      <a href="#">복지용구 안내</a>
    </div>
    <div class="nav-right">국민건강보험공단 공공데이터</div>
  </div>
</nav>

<div class="wrapper">
  <div class="search-area">
    <div class="search-inputs">
      <select id="sido" onchange="loadSigungu()">
        <option value="">시/도 선택</option>
        <option value="11">서울시</option>
        <option value="41">경기도</option>
        <option value="28">인천시</option>
        <option value="26">부산시</option>
        <option value="27">대구시</option>
        <option value="29">광주시</option>
        <option value="30">대전시</option>
        <option value="31">울산시</option>
        <option value="36">세종시</option>
        <option value="42">강원도</option>
        <option value="43">충청북도</option>
        <option value="44">충청남도</option>
        <option value="45">전라북도</option>
        <option value="46">전라남도</option>
        <option value="47">경상북도</option>
        <option value="48">경상남도</option>
        <option value="50">제주도</option>
      </select>
      <select id="sigungu"><option value="">시/군/구 선택</option></select>
      <select id="dongFilter" onchange="filterAndDisplay()"><option value="">읍/면/동 전체</option></select>
      <input type="text" id="nameSearch" placeholder="기관명 검색" onkeydown="if(event.key==='Enter')searchInstitutions()">
      <button class="search-btn" onclick="searchInstitutions()">검색</button>
    </div>
    <div class="search-tabs">
      <button class="tab-btn active" onclick="setTab(this,'')">전체</button>
      <button class="tab-btn" onclick="setTab(this,'A')">요양시설</button>
      <button class="tab-btn" onclick="setTab(this,'B03,C03')">주간보호</button>
      <button class="tab-btn" onclick="setTab(this,'B01,C01')">방문요양</button>
      <button class="tab-btn" onclick="setTab(this,'B02,C02')">방문목욕</button>
      <button class="tab-btn" onclick="setTab(this,'B06,C06')">복지용구</button>
      <button class="tab-btn" onclick="setTab(this,'G,M,H,I,S')">치매전담</button>
    </div>
  </div>

  <div class="three-col">
    <div class="sidebar-left">
      <div class="side-title">급여종류</div>
      <button class="side-item active" onclick="setSide(this,'')">전체</button>
      <button class="side-item" onclick="setSide(this,'A')">요양시설</button>
      <button class="side-item" onclick="setSide(this,'B03,C03')">주간보호</button>
      <button class="side-item" onclick="setSide(this,'B01,C01')">방문요양</button>
      <button class="side-item" onclick="setSide(this,'B02,C02')">방문목욕</button>
      <button class="side-item" onclick="setSide(this,'B05,C05')">방문간호</button>
      <button class="side-item" onclick="setSide(this,'B04,C04')">단기보호</button>
      <button class="side-item" onclick="setSide(this,'B06,C06')">복지용구</button>
      <button class="side-item" onclick="setSide(this,'G,M,H,I,S')">치매전담</button>
    </div>

    <div class="main-center" id="mainCenter">
      <div class="mobile-cats">
        <button class="mobile-cat-btn active" onclick="setMobileCat(this,'')">전체</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'A')">요양시설</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'B03,C03')">주간보호</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'B01,C01')">방문요양</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'B02,C02')">방문목욕</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'B06,C06')">복지용구</button>
        <button class="mobile-cat-btn" onclick="setMobileCat(this,'G,M,H,I,S')">치매전담</button>
      </div>

      <div class="result-header">
        <span class="result-count" id="list-count">지역을 선택하고 검색해주세요</span>
        <div class="result-sort">
          <select id="sortOrder" onchange="filterAndDisplay()">
            <option value="default">기본순</option>
            <option value="name">가나다순</option>
          </select>
        </div>
      </div>

      <div class="content-area">
        <div class="list-area">
          <div class="list-scroll" id="inst-list">
            <div class="empty-state">🗺️ 시/도와 시/군/구를 선택한 후<br>검색 버튼을 눌러주세요</div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
        <div class="map-area" id="mapArea">
          <div id="map"></div>
          <div class="map-popup" id="mapPopup">
            <button class="popup-close" onclick="closePopup()">✕</button>
            <div class="popup-badge" id="popupType"></div>
            <div class="popup-name" id="popupName"></div>
            <div class="popup-addr" id="popupAddr"></div>
            <div class="popup-tel" id="popupTel"></div>
            <button class="popup-btn" id="popupBtn">상세정보 보기 →</button>
          </div>
        </div>
        <div class="detail-wrap" id="detailWrap">
          <div class="detail-inner">
            <button class="detail-back" onclick="showMain()">← 목록으로 돌아가기</button>
            <div id="detailContent"><div class="loading-msg">불러오는 중...</div></div>
            <div id="detailMap"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-right">
      <div class="ad-label">광고</div>
      <div class="ad-block ad-block-lg">광고<br>160×280</div>
      <div class="ad-label">광고</div>
      <div class="ad-block ad-block-md">광고<br>160×120</div>
    </div>
  </div>
</div>

function loadSigungu(){
  var v=document.getElementById('sido').value;
  var s=document.getElementById('sigungu');
  s.innerHTML='<option value="">시/군/구 선택</option>';
  if(!v||!sigunguData[v])return;
  sigunguData[v].forEach(function(i){var o=document.createElement('option');o.value=i.code;o.textContent=i.name;s.appendChild(o);});
}

function setTab(el,type){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  document.querySelectorAll('.side-item').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.side-item').forEach(function(b){if(b.getAttribute('onclick').includes("'"+type+"'")){b.classList.add('active');}});
  document.querySelectorAll('.mobile-cat-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.mobile-cat-btn').forEach(function(b){if(b.getAttribute('onclick').includes("'"+type+"'")){b.classList.add('active');}});
  currentType=type;
  if(allItems.length>0){currentPage=1;filterAndDisplay();}
}

function showMain(){
  document.getElementById('mapArea').style.display='';
  document.getElementById('detailWrap').classList.remove('show');
  window.scrollTo(0,0);
}

function closePopup(){document.getElementById('mapPopup').classList.remove('show');}

function searchInstitutions(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  var nameVal=document.getElementById('nameSearch').value.trim();
  if(!sido.value){alert('시/도를 선택해주세요');return;}
  document.getElementById('list-count').textContent='검색 중...';
  document.getElementById('inst-list').innerHTML='<div class="empty-state">데이터를 불러오는 중...</div>';
  document.getElementById('dongFilter').innerHTML='<option value="">읍/면/동 전체</option>';
  document.getElementById('pagination').innerHTML='';
  closePopup();
  var url='/api/search?sidoCd='+sido.value;
  if(sigungu.value)url+='&sigunguCd='+sigungu.value;
  if(nameVal)url+='&name='+encodeURIComponent(nameVal);
  fetch(url).then(function(r){return r.json();}).then(function(data){
    allItems=data.items||[];
    currentPage=1;
    if(allItems.length===0){
      document.getElementById('list-count').textContent='검색 결과 없음';
      document.getElementById('inst-list').innerHTML='<div class="empty-state">검색 결과가 없습니다</div>';
      return;
    }
    filterAndDisplay();
    loadAddresses();
  }).catch(function(){
    document.getElementById('list-count').textContent='오류 발생';
    document.getElementById('inst-list').innerHTML='<div class="empty-state">데이터를 불러오지 못했습니다</div>';
  });
}

function loadAddresses(){
  var batch=allItems.slice(0,30);
  Promise.all(batch.map(function(inst){
    return fetch('/api/detail?sym='+inst.longTermAdminSym+'&type='+inst.adminPttnCd).then(function(r){return r.json();}).then(function(d){
      if(d.address&&d.address.roadAddr){inst.roadAddr=d.address.roadAddr;inst.emdNm=d.address.emdNm||'';}
    }).catch(function(){});
  })).then(function(){
    var dongs=new Set();
    allItems.forEach(function(i){if(i.emdNm)dongs.add(i.emdNm);});
    var sel=document.getElementById('dongFilter');
    sel.innerHTML='<option value="">읍/면/동 전체</option>';
    Array.from(dongs).sort().forEach(function(d){var o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
    filterAndDisplay();
  });
}

function getFiltered(){
  var dongVal=document.getElementById('dongFilter').value;
  var sortVal=document.getElementById('sortOrder').value;
  var filtered=allItems.slice();
  if(currentType){
    var types=currentType.split(',');
    filtered=filtered.filter(function(i){return types.some(function(t){return i.adminPttnCd.startsWith(t);});});
  }
  if(dongVal){filtered=filtered.filter(function(i){return i.emdNm===dongVal;});}
  if(sortVal==='name'){filtered.sort(function(a,b){return a.longTermCareInstNm.localeCompare(b.longTermCareInstNm,'ko');});}
  return filtered;
}

function filterAndDisplay(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  var sidoName=sido.selectedIndex>0?sido.options[sido.selectedIndex].text:'';
  var sigunguName=sigungu.selectedIndex>0?sigungu.options[sigungu.selectedIndex].text:'';
  var filtered=getFiltered();
  var totalPages=Math.ceil(filtered.length/pageSize);
  if(currentPage>totalPages&&totalPages>0)currentPage=1;
  var start=(currentPage-1)*pageSize;
  var pageItems=filtered.slice(start,start+pageSize);
  document.getElementById('list-count').textContent=sidoName+' '+sigunguName+' '+(filtered.length>0?filtered.length+'곳':'검색 결과 없음');
  clearMarkers();
  var html='';
  pageItems.forEach(function(inst,idx){
    var sym=inst.longTermAdminSym;var type=inst.adminPttnCd;var name=inst.longTermCareInstNm;
    html+='<div class="inst-card" id="card-'+sym+'" onclick="selectInst(\''+sym+'\',\''+type+'\',\''+name.replace(/'/g,"\\'")+'\')">'+
      '<span class="inst-badge">'+getTypeName(type)+'</span>'+
      '<div class="inst-name">'+name+'</div>'+
      (inst.roadAddr?'<div class="inst-addr">📍 '+inst.roadAddr+'</div>':'')+
      '</div>';
    if(idx===4)html+='<div class="ad-slot-list">광고</div>';
    if(inst.roadAddr&&geocoder&&map){
      (function(addr,nm,s,t){
        geocoder.addressSearch(addr,function(result,status){
          if(status===kakao.maps.services.Status.OK){
            var coords=new kakao.maps.LatLng(result[0].y,result[0].x);
            var marker=new kakao.maps.Marker({map:map,position:coords,title:nm});
            kakao.maps.event.addListener(marker,'click',function(){selectInst(s,t,nm);map.setCenter(coords);map.setLevel(5);});
            markers.push(marker);
            if(markers.length===1){map.setCenter(coords);map.setLevel(7);}
          }
        });
      })(inst.roadAddr,name,sym,type);
    }
  });
  document.getElementById('inst-list').innerHTML=html||'<div class="empty-state">조건에 맞는 기관이 없습니다</div>';
  renderPagination(totalPages);
}

function renderPagination(totalPages){
  if(totalPages<=1){document.getElementById('pagination').innerHTML='';return;}
  var html='<div class="page-btn'+(currentPage===1?' disabled':'')+'" onclick="goPage('+(currentPage-1)+')">‹</div>';
  var start=Math.max(1,currentPage-2);var end=Math.min(totalPages,currentPage+2);
  if(start>1){html+='<div class="page-btn" onclick="goPage(1)">1</div>';if(start>2)html+='<div class="page-btn disabled">···</div>';}
  for(var i=start;i<=end;i++){html+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</div>';}
  if(end<totalPages){if(end<totalPages-1)html+='<div class="page-btn disabled">···</div>';html+='<div class="page-btn" onclick="goPage('+totalPages+')">'+totalPages+'</div>';}
  html+='<div class="page-btn'+(currentPage===totalPages?' disabled':'')+'" onclick="goPage('+(currentPage+1)+')">›</div>';
  document.getElementById('pagination').innerHTML=html;
}

function goPage(p){
  var filtered=getFiltered();var totalPages=Math.ceil(filtered.length/pageSize);
  if(p<1||p>totalPages)return;
  currentPage=p;filterAndDisplay();
  document.getElementById('inst-list').scrollTop=0;
}

function selectInst(sym,type,name){
  document.querySelectorAll('.inst-card').forEach(function(c){c.classList.remove('active');});
  var card=document.getElementById('card-'+sym);
  if(card)card.classList.add('active');
  document.getElementById('popupType').textContent=getTypeName(type);
  document.getElementById('popupName').textContent=name;
  document.getElementById('popupAddr').textContent='주소 불러오는 중...';
  document.getElementById('popupTel').textContent='';
  document.getElementById('mapPopup').classList.add('show');
  document.getElementById('popupBtn').onclick=function(){openDetail(sym,type,name);};
  fetch('/api/detail?sym='+sym+'&type='+type).then(function(r){return r.json();}).then(function(d){
    var addr=d.address&&d.address.roadAddr?d.address.roadAddr:'주소 정보 없음';
    var g=d.general||{};
    var tel='';
    if(g.locTelNo_1||g.locTelNo1){tel='📞 '+(g.locTelNo_1||g.locTelNo1)+'-'+(g.locTelNo_2||g.locTelNo2)+'-'+(g.locTelNo_3||g.locTelNo3);}
    document.getElementById('popupAddr').textContent='📍 '+addr;
    document.getElementById('popupTel').textContent=tel;
  }).catch(function(){});
}

function openDetail(sym,type,name){
  document.getElementById('mapArea').style.display='none';
  document.getElementById('detailWrap').classList.add('show');
  document.getElementById('detailContent').innerHTML='<div class="loading-msg">🏥 '+name+' 정보를 불러오는 중...</div>';
  document.getElementById('detailMap').style.display='none';
  detailMap=null;
  window.scrollTo(0,0);
  fetch('/api/detail?sym='+sym+'&type='+type).then(function(r){return r.json();}).then(function(data){
    renderDetail(data,name,type);
  }).catch(function(){
    document.getElementById('detailContent').innerHTML='<div class="empty-state">상세 정보를 불러오지 못했습니다</div>';
  });
}

function renderDetail(data,name,type){
  var g=data.general||{};var s=data.staff||{};var f=data.facility||{};
  var c=data.capacity||{};var e=data.etc||{};var nb=data.nonBenefit||[];var wf=data.welfare||[];
  var addr=data.address&&data.address.roadAddr?data.address.roadAddr:'정보 없음';
  var tel='';
  if(g.locTelNo_1||g.locTelNo1){tel=(g.locTelNo_1||g.locTelNo1)+'-'+(g.locTelNo_2||g.locTelNo2)+'-'+(g.locTelNo_3||g.locTelNo3);}
  var totalPer=parseInt(c.totPer)||0;var nowPer=(parseInt(c.maNowPer)||0)+(parseInt(c.fmNowPer)||0);
  var waitPer=(parseInt(c.maRsvPer)||0)+(parseInt(c.fmRsvPer)||0);var fillRate=totalPer>0?Math.round(nowPer/totalPer*100):0;
  var h='<div class="detail-badge">'+getTypeName(type)+'</div>';
  h+='<div class="detail-name">'+name+'</div>';
  h+='<div class="detail-section"><h3>📋 기본 정보</h3><div class="info-grid">';
  h+='<div class="info-item"><div class="lbl">주소</div><div class="val">'+addr+'</div></div>';
  h+='<div class="info-item"><div class="lbl">전화번호</div><div class="val">'+(tel||'정보 없음')+'</div></div>';
  h+='<div class="info-item"><div class="lbl">기관지정일</div><div class="val">'+(g.longTermPeribRgtDt?g.longTermPeribRgtDt.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'정보 없음')+'</div></div>';
  h+='<div class="info-item"><div class="lbl">설치신고일</div><div class="val">'+(g.stpRptDt?g.stpRptDt.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'정보 없음')+'</div></div>';
  if(e.hmpgAddr)h+='<div class="info-item"><div class="lbl">홈페이지</div><div class="val"><a href="'+(e.hmpgAddr.startsWith('http')?e.hmpgAddr:'http://'+e.hmpgAddr)+'" target="_blank" style="color:#1D9E75">'+e.hmpgAddr+'</a></div></div>';
  if(e.tfMth)h+='<div class="info-item"><div class="lbl">교통편</div><div class="val">'+e.tfMth+'</div></div>';
  if(e.pkngEquip)h+='<div class="info-item"><div class="lbl">주차시설</div><div class="val">'+e.pkngEquip+'</div></div>';
  h+='</div></div>';
  if(totalPer>0){
    h+='<div class="detail-section"><h3>👥 입소 현황</h3>';
    h+='<div class="cap-bar"><div class="cap-lbl">정원 '+totalPer+'명</div><div class="cap-bar-bg"><div class="cap-bar-fill" style="width:'+fillRate+'%"></div></div><div class="cap-lbl">현원 '+nowPer+'명 ('+fillRate+'%)</div></div>';
    if(waitPer>0)h+='<div style="text-align:center;color:#e67e22;font-size:14px;margin-top:6px">대기 '+waitPer+'명</div>';
    h+='</div>';
  }
  var staffItems=[{k:'recuProt_1',n:'요양보호사'},{k:'nur',n:'간호사'},{k:'nurArticle',n:'간호조무사'},{k:'socWel',n:'사회복지사'},{k:'physicalMTret',n:'물리치료사'},{k:'wrkMTret',n:'작업치료사'},{k:'chrgDoc',n:'의사(전임)'},{k:'chargeDoc',n:'의사(촉탁)'},{k:'nut',n:'영양사'},{k:'cook',n:'조리원'},{k:'equipLong',n:'시설장'},{k:'ofceEmp',n:'사무원'}];
  var hasStaff=staffItems.some(function(si){return parseInt(s[si.k])>0;});
  if(hasStaff){h+='<div class="detail-section"><h3>👨‍⚕️ 인력 현황</h3><div class="staff-grid">';staffItems.forEach(function(si){var v=parseInt(s[si.k])||0;if(v>0)h+='<div class="staff-item"><div class="staff-num">'+v+'</div><div class="staff-name">'+si.n+'</div></div>';});h+='</div></div>';}
  var facItems=[{k:'prsnRoomreal1',n:'1인실'},{k:'prsnRoomreal2',n:'2인실'},{k:'prsnRoomreal3',n:'3인실'},{k:'prsnRoomreal4',n:'4인실'},{k:'spcAcupRoomreal',n:'특수침실'},{k:'medRoomreal',n:'의료/간호사실'},{k:'funcTrnRoomreal',n:'작업/훈련실'},{k:'pgmRoomreal',n:'프로그램실'},{k:'batRoom',n:'화장실'},{k:'ofce',n:'사무실'}];
  var hasFac=facItems.some(function(fi){return parseInt(f[fi.k])>0;});
  if(hasFac){h+='<div class="detail-section"><h3>🏠 시설 현황</h3><div class="info-grid">';facItems.forEach(function(fi){var v=parseInt(f[fi.k])||0;if(v>0)h+='<div class="info-item"><div class="lbl">'+fi.n+'</div><div class="val">'+v+'개</div></div>';});h+='</div></div>';}
  if(nb.length>0){var nbNames={'1':'식재료비','2':'상급침실사용료','3':'이미용비','4':'경관영양유동식비','5':'간식비','6':'상급침실(2인실)','7':'기타'};h+='<div class="detail-section"><h3>💰 비급여 현황</h3><table class="info-table"><tr><th>항목</th><th>금액</th><th>산출근거</th></tr>';nb.forEach(function(i){h+='<tr><td>'+(nbNames[i.nonpayKind]||i.nonpayKind)+'</td><td>'+(parseInt(i.nonpayTgtAmt)||0).toLocaleString()+'원</td><td>'+(i.prodBase||'')+'</td></tr>';});h+='</table></div>';}
  if(wf.length>0){h+='<div class="detail-section"><h3>🔧 복지용구 현황</h3><table class="info-table"><tr><th>장비명</th><th>제조사</th><th>모델명</th><th>용도</th></tr>';wf.forEach(function(i){h+='<tr><td>'+(i.itemName||'')+'</td><td>'+(i.mnfCo||'')+'</td><td>'+(i.modelNm||'')+'</td><td>'+(i.usage||'')+'</td></tr>';});h+='</table></div>';}
  document.getElementById('detailContent').innerHTML=h;
  if(addr&&addr!=='정보 없음'){
    var dm=document.getElementById('detailMap');
    dm.style.display='block';
    setTimeout(function(){
      try{
        if(!detailMap){detailMap=new kakao.maps.Map(dm,{center:new kakao.maps.LatLng(37.566826,126.978656),level:5});}
        detailMap.relayout();
        setTimeout(function(){
          var gc=new kakao.maps.services.Geocoder();
          gc.addressSearch(addr,function(result,status){
            if(status===kakao.maps.services.Status.OK){
              var coords=new kakao.maps.LatLng(result[0].y,result[0].x);
              detailMap.setCenter(coords);detailMap.setLevel(4);detailMap.relayout();
              new kakao.maps.Marker({map:detailMap,position:coords,title:name});
            }
          });
        },500);
      }catch(err){console.log('map error:',err);}
    },800);
  }
}

function clearMarkers(){markers.forEach(function(m){if(m)m.setMap(null);});markers=[];}
</script>
</body>
</html>
