<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;color:#222;background:#f0f0f0;font-size:15px}

/* 상단 네비 */
.topnav{background:linear-gradient(135deg,#3D3BB5,#6C63FF);width:100%;position:sticky;top:0;z-index:100}
.topnav-inner{max-width:1200px;margin:0 auto;height:44px;display:flex;align-items:center;padding:0 16px;gap:24px}
.logo{color:#fff;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.logo span{color:#DDD8FF}
.nav-links a{color:rgba(255,255,255,0.8);font-size:14px;text-decoration:none;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{color:#fff;font-weight:600}
.nav-right{color:rgba(255,255,255,0.55);font-size:12px;white-space:nowrap}

/* 가운데 정렬 래퍼 */
.wrapper{max-width:1200px;margin:0 auto;background:#fff;min-height:calc(100vh - 44px);box-shadow:0 0 20px rgba(0,0,0,0.08)}

/* 검색 영역 */
.search-area{background:linear-gradient(135deg,#5B5AE0,#7C73F0);padding:14px 16px}
.search-inputs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.search-inputs select,
.search-inputs input[type=text]{height:36px;padding:0 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:'Noto Sans KR',sans-serif;background:#fff;color:#333;flex:1;min-width:90px}
.search-inputs select,.search-inputs input[type=text]{color:#1E1B4B}
.search-inputs select:focus,.search-inputs input:focus{outline:none;border-color:#9896E8}
.search-btn{background:#4B4AC8;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
.search-btn:hover{background:#3D3BB5}
.search-tabs{display:flex;gap:4px;flex-wrap:wrap}

/* 3단 레이아웃 */
.three-col{display:flex;height:calc(100vh - 44px - 102px)}

/* 좌 사이드바 - 계산기 메뉴 */
.sidebar-left{width:120px;flex-shrink:0;background:#F5F5FF;border-right:1px solid #DDD8FF;overflow-y:auto}
.side-section{padding:12px 0;border-bottom:1px solid #e8e8e8}
.side-title{font-size:11px;color:#9CA3AF;padding:0 10px 8px;font-weight:500;letter-spacing:0.3px}
.side-item{display:block;width:100%;padding:8px 10px;font-size:12px;color:#4B5563;cursor:pointer;border:none;background:none;text-align:left;font-family:'Noto Sans KR',sans-serif;line-height:1.4;border-left:3px solid transparent}
.side-item:hover{background:#EEF2FF;color:#5B5AE0}
.side-item.active{color:#5B5AE0;font-weight:600;border-left:3px solid #5B5AE0;background:#EEF2FF}
.side-badge{display:inline-block;background:#fef3c7;color:#92400e;font-size:10px;padding:1px 4px;border-radius:2px;margin-left:2px}

/* 중앙 */
.main-center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* 결과 헤더 */
.result-header{padding:9px 14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;background:#fff;flex-shrink:0}
.result-count{font-size:14px;color:#333}
.result-count strong{font-weight:600;color:#5B5AE0;font-size:15px}
.result-sort select{height:30px;padding:0 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;color:#555;background:#fff;font-family:'Noto Sans KR',sans-serif}

/* 콘텐츠 영역 */
.content-area{display:flex;flex:1;overflow:hidden}

/* 목록 */
.list-area{width:280px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #eee;overflow:hidden}
.list-scroll{flex:1;overflow-y:auto}
.list-scroll::-webkit-scrollbar{width:3px}
.list-scroll::-webkit-scrollbar-thumb{background:#d0e8dc;border-radius:3px}
.inst-card{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.1s}
.inst-card:hover{background:#f8fffe}
.inst-card.active{background:#EEF2FF;border-left:3px solid #5B5AE0;padding-left:11px}
.inst-badge{display:inline-block;background:#EEF2FF;color:#5B5AE0;font-size:11px;padding:2px 7px;border-radius:3px;margin-bottom:5px;font-weight:500}
.inst-name{font-size:14px;font-weight:600;color:#222;margin-bottom:4px;line-height:1.3}
.inst-addr{font-size:12px;color:#666;line-height:1.5}
.ad-slot-list{padding:8px 14px;background:#f9f9f9;border-bottom:1px solid #eee;text-align:center;font-size:11px;color:#bbb;min-height:50px;display:flex;align-items:center;justify-content:center}
.pagination{padding:8px;border-top:1px solid #eee;display:flex;justify-content:center;gap:3px;flex-shrink:0}
.page-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;color:#666;background:#fff}
.page-btn.active{background:#5B5AE0;color:#fff;border-color:#5B5AE0}
.page-btn:hover:not(.active):not(.disabled){border-color:#1D9E75;color:#1D9E75}
.page-btn.disabled{opacity:0.35;cursor:default;pointer-events:none}

/* 오른쪽 패널 (지도 or 상세정보) */
.right-panel{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}

/* 지도 */
.map-view{flex:1;position:relative}
#map{width:100%;height:100%}

/* 상세정보 패널 */
.detail-panel{display:none;flex:1;overflow-y:auto;background:#fff}
.detail-panel.show{display:block}
.detail-panel-inner{padding:20px}
.detail-back{display:inline-flex;align-items:center;gap:5px;border:1px solid #DDD8FF;border-radius:4px;padding:6px 12px;font-size:13px;color:#5B5AE0;cursor:pointer;margin-bottom:16px;background:#fff;font-family:'Noto Sans KR',sans-serif}
.detail-back:hover{background:#f5f5f5}
.detail-badge{display:inline-block;background:#e8f5ee;color:#085041;font-size:12px;padding:3px 10px;border-radius:3px;margin-bottom:8px}
.detail-name{font-size:20px;font-weight:600;color:#222;margin-bottom:16px;line-height:1.3}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:14px;font-weight:600;color:#5B5AE0;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #DDD8FF}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:#F5F5FF;border:1px solid #DDD8FF;border-radius:4px;padding:10px}
.info-item .lbl{font-size:11px;color:#888;margin-bottom:3px}
.info-item .val{font-size:13px;font-weight:500;color:#222;line-height:1.4}
.staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.staff-item{background:#f8fffe;border:1px solid #e8f5ee;border-radius:4px;padding:8px;text-align:center}
.staff-num{font-size:18px;font-weight:600;color:#5B5AE0}
.staff-name{font-size:11px;color:#888;margin-top:2px}
.cap-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cap-bar-bg{flex:1;background:#eee;border-radius:4px;height:18px;overflow:hidden}
.cap-bar-fill{height:100%;background:#5B5AE0;border-radius:4px}
.cap-lbl{font-size:12px;color:#555;min-width:80px}
.info-table{width:100%;border-collapse:collapse;font-size:13px}
.info-table th{background:#EEF2FF;color:#5B5AE0;padding:7px 10px;text-align:left;font-weight:600;border-bottom:1px solid #DDD8FF}
.info-table td{padding:7px 10px;border-bottom:1px solid #f5f5f5;color:#555}
#detailMap{width:100%;height:220px;border-radius:6px;border:1px solid #ddd;margin-top:10px}

/* 계산기 패널 */
.calc-panel{display:none;flex:1;overflow-y:auto;background:#fff}
.calc-panel.show{display:block}
.calc-panel-inner{padding:20px}
.calc-back{display:inline-flex;align-items:center;gap:5px;border:1px solid #ddd;border-radius:4px;padding:6px 12px;font-size:13px;color:#555;cursor:pointer;margin-bottom:16px;background:#fff;font-family:'Noto Sans KR',sans-serif}
.calc-back:hover{background:#f5f5f5}

/* 우 사이드바 */
.sidebar-right{width:160px;flex-shrink:0;background:#F5F5FF;border-left:1px solid #DDD8FF;padding:12px;display:flex;flex-direction:column;gap:8px
.ad-label{font-size:11px;color:#bbb;text-align:center}
.ad-block{background:#fff;border:1px solid #e0e0e0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:11px;text-align:center}
.ad-block-lg{height:280px}
.ad-block-md{height:120px}

/* 공통 */
.loading-msg{text-align:center;padding:40px;color:#5B5AE0;font-size:14px}
.empty-state{text-align:center;padding:40px 24px;color:#bbb;font-size:14px;line-height:2}

/* 반응형 */
@media(max-width:1024px){.sidebar-right{display:none}}
@media(max-width:768px){
  .sidebar-left{display:none}
  .nav-links a:not(.active){display:none}
  .nav-right{display:none}
  .content-area{flex-direction:column}
  .list-area{width:100%;height:40vh;border-right:none;border-bottom:1px solid #eee}
  .right-panel{height:60vh}
  .info-grid{grid-template-columns:1fr}
  .staff-grid{grid-template-columns:repeat(2,1fr)}
  .three-col{height:auto;flex-direction:column}
  .main-center{height:auto}
}
</style>

window.addEventListener('DOMContentLoaded',function(){
  var params=new URLSearchParams(window.location.search);
  var sidoCd=params.get('sidoCd');
  var sigunguCd=params.get('sigunguCd');
  var type=params.get('type');
  if(sidoCd){
    var sido=document.getElementById('sido');
    sido.value=sidoCd;
    loadSigungu();
    if(sigunguCd){
      setTimeout(function(){
        document.getElementById('sigungu').value=sigunguCd;
      },100);
    }
    if(type){
      currentType=type;
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      document.querySelectorAll('.tab-btn').forEach(function(b){
        if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+type+"'")){b.classList.add('active');}
      });
    }
    setTimeout(function(){searchInstitutions();},500);
  }
});

function initMap(){

    center:new kakao.maps.LatLng(37.5663,126.9779),
    level:8
  });
  geocoder=new kakao.maps.services.Geocoder();
  setTimeout(function(){map.relayout();},300);
}

  document.getElementById('mapView').style.display='';

function calcReGa(){
  var gradeVals={'1':2306550,'2':2143240,'3':1712580,'4':1572880,'5':1352900,'6':694200};
  var grade=document.getElementById('calcGrade').value;
  var rate=parseFloat(document.getElementById('calcRate').value);
  if(!grade)return;
  var limit=gradeVals[grade];
  var amount=Math.round(limit*rate);
  document.getElementById('calcResult').style.display='block';
  document.getElementById('calcResultNum').textContent=amount.toLocaleString()+'원';
}

function calcSiSeol(){
  var gradeVals={'1':74390,'2':69060,'3':63740};
  var grade=document.getElementById('calcGrade2').value;
  var rate=parseFloat(document.getElementById('calcRate2').value);
  if(!grade)return;
  var daily=gradeVals[grade];
  var amount=Math.round(daily*30*rate);
  document.getElementById('calcResult2').style.display='block';
  document.getElementById('calcResultNum2').textContent=amount.toLocaleString()+'원';
}

function calcGrade(){
  var total=0;
  document.querySelectorAll('#gradeForm input[type=checkbox]:checked').forEach(function(cb){
    total+=parseFloat(cb.value);
  });
  total=Math.min(total,100);
  document.getElementById('gradeScore').textContent=total.toFixed(1)+'점';
  var level='';
  if(total>=95)level='1등급 예상';
  else if(total>=75)level='2등급 예상';
  else if(total>=60)level='3등급 예상';
  else if(total>=51)level='4등급 예상';
  else if(total>=45)level='5등급 예상 (치매 진단 필요)';
  else level='등급외 (요양 대상 아님)';
  document.getElementById('gradeLevel').textContent=level;
}

function searchInstitutions(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  currentType=document.getElementById('typeFilter').value;
  if(!sido.value){alert('시/도를 선택해주세요');return;}
  document.getElementById('list-count').textContent='검색 중...';
  document.getElementById('inst-list').innerHTML='<div class="empty-state">데이터를 불러오는 중...</div>';
  document.getElementById('pagination').innerHTML='';

  if(sigungu.value)url+='&sigunguCd='+sigungu.value;
  fetch(url).then(function(r){return r.json();}).then(function(data){
    allItems=data.items||[];
    allItems.forEach(function(inst){
      if(inst.siDoCd&&inst.siGunGuCd&&inst.BDongCd){
        var mapKey=inst.siDoCd+inst.siGunGuCd+inst.BDongCd;
        inst.emdNm=dongCodeMap[mapKey]||'';
      }
    });

      document.getElementById('list-count').textContent='검색 결과 없음';
      document.getElementById('inst-list').innerHTML='<div class="empty-state">검색 결과가 없습니다</div>';

    document.getElementById('inst-list').innerHTML='<div class="empty-state">데이터를 불러오지 못했습니다</div>';
  });
}

var isLoadingPage=false;
function loadPageAddresses(){
  if(isLoadingPage)return;
  var filtered=getFiltered();
  var start=(currentPage-1)*pageSize;
  var pageItems=filtered.slice(start,start+pageSize);
  var needLoad=pageItems.filter(function(i){return !i.roadAddr;});
  if(needLoad.length===0)return;
  isLoadingPage=true;
  Promise.all(needLoad.map(function(inst){
    return fetch('/api/detail?sym='+inst.longTermAdminSym+'&type='+inst.adminPttnCd).then(function(r){return r.json();}).then(function(d){
      if(d.address&&d.address.roadAddr){inst.roadAddr=d.address.roadAddr;inst.emdNm=d.address.emdNm||'';}
      if(d.coords&&d.coords.entX&&d.coords.entY){inst.entX=d.coords.entX;inst.entY=d.coords.entY;}
    }).catch(function(){});
  })).then(function(){
    isLoadingPage=false;
    filterAndDisplay();
  });
}

function getFiltered(){
  var dongVal='';
  var sortVal=document.getElementById('sortOrder').value;
  var filtered=allItems.slice();
  if(currentType){var types=currentType.split(',');filtered=filtered.filter(function(i){
    if(i.types&&i.types.length>0){return i.types.some(function(it){return types.some(function(t){return it.cd.startsWith(t);});});}
    return types.some(function(t){return i.adminPttnCd.startsWith(t);});
  });}
  if(dongVal){filtered=filtered.filter(function(i){return !i.emdNm || i.emdNm===dongVal;});}
  if(sortVal==='name'){filtered.sort(function(a,b){return a.longTermCareInstNm.localeCompare(b.longTermCareInstNm,'ko');});}
  return filtered;
}

function filterAndDisplay(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  var sidoName=sido.selectedIndex>0?sido.options[sido.selectedIndex].text:'';
  var sigunguName=sigungu.selectedIndex>0?sigungu.options[sigungu.selectedIndex].text:'';
  var filtered=getFiltered();
  var totalPages=Math.ceil(filtered.length/pageSize);
  if(currentPage>totalPages&&totalPages>0)currentPage=1;
  var start=(currentPage-1)*pageSize;
  var pageItems=filtered.slice(start,start+pageSize);
  document.getElementById('list-count').innerHTML=sidoName+' '+sigunguName+' '+(filtered.length>0?'<strong>'+filtered.length+'곳</strong>':'검색 결과 없음');
  clearMarkers();
  var html='';
  pageItems.forEach(function(inst,idx){
    var sym=inst.longTermAdminSym;var type=inst.adminPttnCd;var name=inst.longTermCareInstNm;
    html+='<div class="inst-card" id="card-'+sym+'" onclick="selectInst(\''+sym+'\',\''+type+'\',\''+name.replace(/'/g,"\\'")+'\')">'+
      (inst.types&&inst.types.length>0?inst.types.map(function(t){return '<span class="inst-badge">'+t.nm+'</span>';}).join(' '):'<span class="inst-badge">'+getTypeName(type)+'</span>')+
      '<div class="inst-name">'+name+'</div>'+
      (inst.roadAddr?'<div class="inst-addr">📍 '+inst.roadAddr+'</div>':(inst.emdNm?'<div class="inst-addr">📍 '+sidoName+' '+sigunguName+' '+inst.emdNm+'</div>':''))+
      '</div>';
    if(idx===4)html+='<div class="ad-slot-list">광고</div>';
    if(inst.entX&&inst.entY&&map){
      (function(x,y,nm,s,t){
        var pos=new kakao.maps.LatLng(parseFloat(y),parseFloat(x));
        var marker=new kakao.maps.Marker({map:map,position:pos,title:nm});
        kakao.maps.event.addListener(marker,'click',function(){
          selectInst(s,t,nm);
          map.setCenter(pos);map.setLevel(4);
        });
        markers.push(marker);
        if(markers.length===1){map.setCenter(pos);map.setLevel(7);}
      })(inst.entX,inst.entY,name,sym,type);
    } else if(inst.roadAddr&&geocoder&&map){
      (function(addr,nm,s,t){
        geocoder.addressSearch(addr,function(result,status){
          if(status===kakao.maps.services.Status.OK){
            var coords=new kakao.maps.LatLng(result[0].y,result[0].x);
            var marker=new kakao.maps.Marker({map:map,position:coords,title:nm});
            kakao.maps.event.addListener(marker,'click',function(){
              selectInst(s,t,nm);
              map.setCenter(coords);map.setLevel(4);
            });
            markers.push(marker);
            if(markers.length===1){map.setCenter(coords);map.setLevel(7);}
          }
        });
      })(inst.roadAddr,name,sym,type);
    }
  });
  document.getElementById('inst-list').innerHTML=html||'<div class="empty-state">조건에 맞는 기관이 없습니다</div>';
  renderPagination(totalPages);
}

function renderPagination(totalPages){
  if(totalPages<=1){document.getElementById('pagination').innerHTML='';return;}
  var html='<div class="page-btn'+(currentPage===1?' disabled':'')+'" onclick="goPage('+(currentPage-1)+')">‹</div>';
  var start=Math.max(1,currentPage-2);var end=Math.min(totalPages,currentPage+2);
  if(start>1){html+='<div class="page-btn" onclick="goPage(1)">1</div>';if(start>2)html+='<div class="page-btn disabled">···</div>';}
  for(var i=start;i<=end;i++){html+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</div>';}
  if(end<totalPages){if(end<totalPages-1)html+='<div class="page-btn disabled">···</div>';html+='<div class="page-btn" onclick="goPage('+totalPages+')">'+totalPages+'</div>';}
  html+='<div class="page-btn'+(currentPage===totalPages?' disabled':'')+'" onclick="goPage('+(currentPage+1)+')">›</div>';
  document.getElementById('pagination').innerHTML=html;
}

function goPage(p){
  var filtered=getFiltered();var totalPages=Math.ceil(filtered.length/pageSize);
  if(p<1||p>totalPages)return;
  currentPage=p;filterAndDisplay();loadPageAddresses();
  document.getElementById('inst-list').scrollTop=0;
}

function selectInst(sym,type,name){
  document.querySelectorAll('.inst-card').forEach(function(c){c.classList.remove('active');});
  var card=document.getElementById('card-'+sym);if(card)card.classList.add('active');
  showDetail();
  document.getElementById('detailContent').innerHTML='<div class="loading-msg">🏥 '+name+' 정보를 불러오는 중...</div>';
  document.getElementById('detailMap').style.display='none';
  detailMap=null;
  fetch('/api/detail?sym='+sym+'&type='+type).then(function(r){return r.json();}).then(function(data){
    renderDetail(data,name,type);
  }).catch(function(){
    document.getElementById('detailContent').innerHTML='<div class="empty-state">상세 정보를 불러오지 못했습니다</div>';
  });
}

              var coords=new kakao.maps.LatLng(result[0].y,result[0].x);
              detailMap.setCenter(coords);detailMap.setLevel(4);detailMap.relayout();
              new kakao.maps.Marker({map:detailMap,position:coords,title:name});
            }
          });
        },500);
      }catch(err){console.log('map error:',err);}
    },800);
  }
}

function clearMarkers(){markers.forEach(function(m){if(m)m.setMap(null);});markers=[];}
</script>
<script>
window.addEventListener('load', function(){
  if(typeof kakao !== 'undefined' && kakao.maps){
    initMap();
  }
});
</script>
<script src="/widget.js"></script>
