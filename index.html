body{font-family:'Noto Sans KR',sans-serif;color:#222;background:#f0f0f0;font-size:15px}

.search-area{background:linear-gradient(135deg,#5B5AE0,#7C73F0);padding:14px 16px}

.search-inputs select:focus{outline:none;border-color:#9896E8}
.search-btn{background:#4B4AC8;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}

.three-col{display:flex;height:calc(100vh - 44px - 66px)}
.main-center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

.result-count{font-size:14px;color:#333}
.result-count strong{font-weight:600;color:#5B5AE0;font-size:15px}
.result-sort select{height:30px;padding:0 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;color:#555;background:#fff;font-family:'Noto Sans KR',sans-serif}
.content-area{display:flex;flex:1;overflow:hidden}
.list-area{width:320px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #eee;overflow:hidden}
.list-scroll{flex:1;overflow-y:auto;padding:0 8px}
.list-scroll::-webkit-scrollbar{width:3px}
.list-scroll::-webkit-scrollbar-thumb{background:#d0d0f0;border-radius:3px}
.inst-card{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.1s}
.inst-card:hover{background:#F5F5FF}
.inst-card.active{background:#EEF2FF;border-left:3px solid #5B5AE0;padding-left:11px}
.inst-badge{display:inline-block;background:#EEF2FF;color:#5B5AE0;font-size:11px;padding:2px 7px;border-radius:3px;margin-bottom:5px;font-weight:500;margin-right:3px}

.pagination{padding:8px;border-top:1px solid #eee;display:flex;justify-content:center;gap:3px;flex-shrink:0}

.page-btn.active{background:#5B5AE0;color:#fff;border-color:#5B5AE0}

.page-btn.disabled{opacity:0.35;cursor:default;pointer-events:none}
.right-panel{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.map-view{flex:1;position:relative}
#map{width:100%;height:100%}
.detail-panel{display:none;flex:1;overflow-y:auto;background:#fff}
.detail-panel.show{display:block}
.detail-panel-inner{padding:20px}
.detail-back{display:inline-flex;align-items:center;gap:5px;border:1px solid #DDD8FF;border-radius:4px;padding:6px 12px;font-size:13px;color:#5B5AE0;cursor:pointer;margin-bottom:16px;background:#fff;font-family:'Noto Sans KR',sans-serif}
.detail-back:hover{background:#f5f5f5}

.detail-section{margin-bottom:20px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:#F5F5FF;border:1px solid #DDD8FF;border-radius:4px;padding:10px}
.info-item .lbl{font-size:11px;color:#888;margin-bottom:3px}
.info-item .val{font-size:13px;font-weight:500;color:#222;line-height:1.4}
.staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.staff-item{background:#F5F5FF;border:1px solid #DDD8FF;border-radius:4px;padding:8px;text-align:center}
.staff-num{font-size:18px;font-weight:600;color:#5B5AE0}
.staff-name{font-size:11px;color:#888;margin-top:2px}

  .main-center{height:auto}
  .search-inputs{flex-direction:column}

/* ── URL 파라미터 자동 검색 ── */
window.addEventListener('DOMContentLoaded',function(){
  var params=new URLSearchParams(window.location.search);
  var sidoCd=params.get('sidoCd');
  var sigunguCd=params.get('sigunguCd');
  var type=params.get('type');
  if(sidoCd){
    document.getElementById('sido').value=sidoCd;
    loadSigungu();
    if(sigunguCd)setTimeout(function(){document.getElementById('sigungu').value=sigunguCd;},100);
    if(type){currentType=type;document.getElementById('typeFilter').value=type;}
    setTimeout(function(){searchInstitutions();},500);
  }
});

/* ── 지도 초기화 ── */
function initMap(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5663,126.9779),level:8});
  setTimeout(function(){map.relayout();},300);
}

function showMap(){
  document.getElementById('mapView').style.display='';
  document.getElementById('detailPanel').classList.remove('show');
  if(map)setTimeout(function(){map.relayout();},100);
}

function showDetail(){
  document.getElementById('mapView').style.display='none';
  document.getElementById('detailPanel').classList.add('show');
}

/* ── 시/군/구 로드 ── */
function loadSigungu(){
  var v=document.getElementById('sido').value;
  var s=document.getElementById('sigungu');
  s.innerHTML='<option value="">시/군/구 선택</option>';
  if(!v||!sigunguData[v])return;
  sigunguData[v].forEach(function(i){var o=document.createElement('option');o.value=i.code;o.textContent=i.name;s.appendChild(o);});
}

/* ── 검색 (JSON 로드) ── */
function searchInstitutions(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  currentType=document.getElementById('typeFilter').value;
  if(!sido.value){alert('시/도를 선택해주세요');return;}
  if(!sigungu.value){alert('시/군/구를 선택해주세요');return;}
  document.getElementById('list-count').textContent='검색 중...';
  document.getElementById('inst-list').innerHTML='<div class="empty-state">데이터를 불러오는 중...</div>';
  document.getElementById('pagination').innerHTML='';
  showMap();
  fetch('/data/'+sido.value+'/'+sigungu.value+'.json')
    .then(function(r){if(!r.ok)throw new Error('없음');return r.json();})
    .then(function(data){
      allItems=data||[];
      currentPage=1;
      if(allItems.length===0){
        document.getElementById('list-count').textContent='검색 결과 없음';
        document.getElementById('inst-list').innerHTML='<div class="empty-state">검색 결과가 없습니다</div>';
        return;
      }
      filterAndDisplay();
    })
    .catch(function(){
      document.getElementById('list-count').textContent='데이터 준비 중';
      document.getElementById('inst-list').innerHTML='<div class="empty-state">해당 지역 데이터가 아직 준비되지 않았습니다.<br>현재 경기도만 지원됩니다.</div>';
    });
}

/* ── 필터링 ── */
function getFiltered(){
  var sortVal=document.getElementById('sortOrder').value;
  var filtered=allItems.slice();
  if(currentType){
    var types=currentType.split(',');
    filtered=filtered.filter(function(i){
      if(i.typeCodes&&i.typeCodes.length>0){
        return i.typeCodes.some(function(tc){return types.some(function(t){return tc.startsWith(t);});});
      }
      return false;
    });
  }
  if(sortVal==='name')filtered.sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');});
  return filtered;
}

/* ── 목록 표시 + 지도 마커 ── */
function filterAndDisplay(){
  var sido=document.getElementById('sido');
  var sigungu=document.getElementById('sigungu');
  var sidoName=sido.selectedIndex>0?sido.options[sido.selectedIndex].text:'';
  var sigunguName=sigungu.selectedIndex>0?sigungu.options[sigungu.selectedIndex].text:'';
  var filtered=getFiltered();
  var totalPages=Math.ceil(filtered.length/pageSize);
  if(currentPage>totalPages&&totalPages>0)currentPage=1;
  var start=(currentPage-1)*pageSize;
  var pageItems=filtered.slice(start,start+pageSize);

  document.getElementById('list-count').innerHTML=sidoName+' '+sigunguName+' '+(filtered.length>0?'<strong>'+filtered.length+'곳</strong>':'검색 결과 없음');

  // 기존 마커 제거
  clearMarkers();

  var html='';
  var bounds=new kakao.maps.LatLngBounds();
  var hasMarker=false;

  pageItems.forEach(function(inst,idx){
    var sym=inst.sym;
    var name=inst.name;
    var badges=inst.types&&inst.types.length>0
      ? inst.types.map(function(t){return '<span class="inst-badge">'+t+'</span>';}).join('')
      : '<span class="inst-badge">'+getTypeName((inst.typeCodes&&inst.typeCodes[0])||'')+'</span>';

    html+='<div class="inst-card" id="card-'+sym+'" onclick="selectInst(\''+sym+'\')">'+
      badges+
      '<div class="inst-name">'+name+'</div>'+
      (inst.address ? '<div class="inst-addr">\uD83D\uDCCD '+inst.address+'</div>' : '')+
      '</div>';

    if(idx===4) html+='<div class="ad-slot-list">광고</div>';

    // 지도 마커 생성
    if(inst.lat && inst.lng && map){
      var pos=new kakao.maps.LatLng(inst.lat, inst.lng);
      var marker=new kakao.maps.Marker({map:map, position:pos, title:name});
      kakao.maps.event.addListener(marker,'click',(function(s,p){
        return function(){selectInst(s);map.setCenter(p);map.setLevel(4);};
      })(sym,pos));
      markers.push(marker);
      bounds.extend(pos);
      hasMarker=true;
    }
  });

  // 지도 범위 자동 조정
  if(hasMarker && map){
    map.setBounds(bounds);
    if(pageItems.length===1) map.setLevel(4);
  }

  document.getElementById('inst-list').innerHTML=html||'<div class="empty-state">조건에 맞는 기관이 없습니다</div>';
  renderPagination(totalPages);
}

/* ── 페이지네이션 ── */
function renderPagination(totalPages){
  if(totalPages<=1){document.getElementById('pagination').innerHTML='';return;}
  var html='<div class="page-btn'+(currentPage===1?' disabled':'')+'" onclick="goPage('+(currentPage-1)+')">‹</div>';
  var start=Math.max(1,currentPage-2),end=Math.min(totalPages,currentPage+2);
  if(start>1){html+='<div class="page-btn" onclick="goPage(1)">1</div>';if(start>2)html+='<div class="page-btn disabled">···</div>';}
  for(var i=start;i<=end;i++) html+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</div>';
  if(end<totalPages){if(end<totalPages-1)html+='<div class="page-btn disabled">···</div>';html+='<div class="page-btn" onclick="goPage('+totalPages+')">'+totalPages+'</div>';}
  html+='<div class="page-btn'+(currentPage===totalPages?' disabled':'')+'" onclick="goPage('+(currentPage+1)+')">›</div>';
  document.getElementById('pagination').innerHTML=html;
}

function goPage(p){
  var totalPages=Math.ceil(getFiltered().length/pageSize);
  if(p<1||p>totalPages)return;
  currentPage=p;
  filterAndDisplay();
  document.getElementById('inst-list').scrollTop=0;
}

/* ── 기관 선택 (로컬 데이터) ── */
function selectInst(sym){window.location.href="/facility/"+sym+".html";return;
  var inst=allItems.find(function(i){return i.sym===sym;});
  if(!inst)return;

  document.querySelectorAll('.inst-card').forEach(function(c){c.classList.remove('active');});
  var card=document.getElementById('card-'+sym);
  if(card)card.classList.add('active');

  showDetail();
  document.getElementById('detailMap').style.display='none';
  detailMap=null;

  var type=(inst.typeCodes&&inst.typeCodes[0])||'';
  renderDetail(inst, inst.name, type);
}

/* ── 상세 렌더링 ── */
function renderDetail(data,name,type){
  var g=data.general||{};
  var s=data.staff||{};
  var f=data.facility||{};
  var c=data.capacity||{};
  var e=data.etc||{};
  var nb=data.nonBenefit||[];
  var wf=data.welfare||[];
  var addr=data.address||'정보 없음';

  var tel='';
  if(g.locTelNo_1||g.locTelNo1) tel=(g.locTelNo_1||g.locTelNo1)+'-'+(g.locTelNo_2||g.locTelNo2)+'-'+(g.locTelNo_3||g.locTelNo3);

  var totalPer=parseInt(c.totPer)||0;
  var nowPer=(parseInt(c.maNowPer)||0)+(parseInt(c.fmNowPer)||0);
  var waitPer=(parseInt(c.maRsvPer)||0)+(parseInt(c.fmRsvPer)||0);
  var fillRate=totalPer>0?Math.round(nowPer/totalPer*100):0;

  var h='<div class="detail-badge">'+getTypeName(type)+'</div>';
  h+='<div class="detail-name">'+name+'</div>';

  // 기본 정보
  h+='<div class="detail-section"><h3>\uD83D\uDCCB 기본 정보</h3><div class="info-grid">';
  h+='<div class="info-item"><div class="lbl">주소</div><div class="val">'+addr+'</div></div>';
  h+='<div class="info-item"><div class="lbl">전화번호</div><div class="val">'+(tel||'정보 없음')+'</div></div>';
  h+='<div class="info-item"><div class="lbl">기관지정일</div><div class="val">'+(g.longTermPeribRgtDt?g.longTermPeribRgtDt.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'정보 없음')+'</div></div>';
  h+='<div class="info-item"><div class="lbl">설치신고일</div><div class="val">'+(g.stpRptDt?g.stpRptDt.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'정보 없음')+'</div></div>';
  if(e.hmpgAddr)h+='<div class="info-item"><div class="lbl">홈페이지</div><div class="val"><a href="'+(e.hmpgAddr.startsWith('http')?e.hmpgAddr:'http://'+e.hmpgAddr)+'" target="_blank" style="color:#5B5AE0">'+e.hmpgAddr+'</a></div></div>';
  if(e.tfMth)h+='<div class="info-item"><div class="lbl">교통편</div><div class="val">'+e.tfMth+'</div></div>';
  if(e.pkngEquip)h+='<div class="info-item"><div class="lbl">주차시설</div><div class="val">'+e.pkngEquip+'</div></div>';
  h+='</div></div>';

  // 입소 현황
  if(totalPer>0){
    h+='<div class="detail-section"><h3>\uD83D\uDC65 입소 현황</h3>';
    h+='<div class="cap-bar"><div class="cap-lbl">정원 '+totalPer+'명</div><div class="cap-bar-bg"><div class="cap-bar-fill" style="width:'+fillRate+'%"></div></div><div class="cap-lbl">현원 '+nowPer+'명 ('+fillRate+'%)</div></div>';
    if(waitPer>0)h+='<div style="text-align:center;color:#e67e22;font-size:13px;margin-top:4px">대기 '+waitPer+'명</div>';
    h+='</div>';
  }

  // 인력 현황
  var staffItems=[{k:'recuProt_1',n:'요양보호사'},{k:'nur',n:'간호사'},{k:'nurArticle',n:'간호조무사'},{k:'socWel',n:'사회복지사'},{k:'physicalMTret',n:'물리치료사'},{k:'wrkMTret',n:'작업치료사'},{k:'chrgDoc',n:'의사(전임)'},{k:'chargeDoc',n:'의사(촉탁)'},{k:'nut',n:'영양사'},{k:'cook',n:'조리원'},{k:'equipLong',n:'시설장'},{k:'ofceEmp',n:'사무원'}];
  var hasStaff=staffItems.some(function(si){return parseInt(s[si.k])>0;});
  if(hasStaff){
    h+='<div class="detail-section"><h3>\uD83D\uDC68\u200D\u2695\uFE0F 인력 현황</h3><div class="staff-grid">';
    staffItems.forEach(function(si){var v=parseInt(s[si.k])||0;if(v>0)h+='<div class="staff-item"><div class="staff-num">'+v+'</div><div class="staff-name">'+si.n+'</div></div>';});
    h+='</div></div>';
  }

  // 시설 현황
  var facItems=[{k:'prsnRoomreal1',n:'1인실'},{k:'prsnRoomreal2',n:'2인실'},{k:'prsnRoomreal3',n:'3인실'},{k:'prsnRoomreal4',n:'4인실'},{k:'spcAcupRoomreal',n:'특수침실'},{k:'medRoomreal',n:'의료/간호사실'},{k:'funcTrnRoomreal',n:'작업/훈련실'},{k:'pgmRoomreal',n:'프로그램실'},{k:'batRoom',n:'화장실'},{k:'ofce',n:'사무실'}];
  var hasFac=facItems.some(function(fi){return parseInt(f[fi.k])>0;});
  if(hasFac){
    h+='<div class="detail-section"><h3>\uD83C\uDFE0 시설 현황</h3><div class="info-grid">';
    facItems.forEach(function(fi){var v=parseInt(f[fi.k])||0;if(v>0)h+='<div class="info-item"><div class="lbl">'+fi.n+'</div><div class="val">'+v+'개</div></div>';});
    h+='</div></div>';
  }

  // 비급여
  if(nb.length>0){
    var nbNames={'1':'식재료비','2':'상급침실사용료','3':'이미용비','4':'경관영양유동식비','5':'간식비','6':'상급침실(2인실)','7':'기타'};
    h+='<div class="detail-section"><h3>\uD83D\uDCB0 비급여 현황</h3><table class="info-table"><tr><th>항목</th><th>금액</th><th>산출근거</th></tr>';
    nb.forEach(function(i){h+='<tr><td>'+(nbNames[i.nonpayKind]||i.nonpayKind)+'</td><td>'+(parseInt(i.nonpayTgtAmt)||0).toLocaleString()+'원</td><td>'+(i.prodBase||'')+'</td></tr>';});
    h+='</table></div>';
  }

  // 복지용구
  if(wf.length>0){
    h+='<div class="detail-section"><h3>\uD83D\uDD27 복지용구 현황</h3><table class="info-table"><tr><th>장비명</th><th>제조사</th><th>모델명</th><th>용도</th></tr>';
    wf.forEach(function(i){h+='<tr><td>'+(i.itemName||'')+'</td><td>'+(i.mnfCo||'')+'</td><td>'+(i.modelNm||'')+'</td><td>'+(i.usage||'')+'</td></tr>';});
    h+='</table></div>';
  }

  document.getElementById('detailContent').innerHTML=h;

  // 상세 지도 (좌표 직접 사용)
  if(addr&&addr!=='정보 없음'){
    var dm=document.getElementById('detailMap');
    dm.style.display='block';
    setTimeout(function(){
      try{
        if(!detailMap) detailMap=new kakao.maps.Map(dm,{center:new kakao.maps.LatLng(37.5663,126.9779),level:5});
        detailMap.relayout();
        setTimeout(function(){
          if(data.lat&&data.lng){
            var coords=new kakao.maps.LatLng(data.lat,data.lng);
            detailMap.setCenter(coords);
            detailMap.setLevel(4);
            detailMap.relayout();
            new kakao.maps.Marker({map:detailMap,position:coords,title:name});
          }
        },500);
      }catch(err){console.log('map error:',err);}
    },800);
  }
}

/* ── 마커 제거 ── */
function clearMarkers(){
  markers.forEach(function(m){if(m)m.setMap(null);});
  markers=[];
}
</script>
<script>
window.addEventListener('load',function(){
  if(typeof kakao!=='undefined'&&kakao.maps) initMap();
});
</script>
<script src="/widget.js"></script>
