  const monthlyLimit = MONTHLY_LIMITS[grade] || 0;
  const recipientRate = RECIPIENT_TYPES.find(r => r.label === recipientType)?.rate ?? null;

  const updateVisitRow = (idx, field, val) => {
    setVisitRows(prev => prev.map((r, i) => i === idx ? { ...r, [field]: val } : r));
  };

  const handleCalc = () => {
    let total = 0;
    visitRows.forEach(row => {
      [1, 2, 3].forEach(n => {
        const sel = row[`sel${n}`]; const days = row[`days${n}`];
        if (sel !== "선택" && days !== "선택") total += getVal(VISIT_CARE_OPTIONS, sel) * Number(days);
      });
    });
    total += getSimpleVal(VISIT_NURSING_OPTIONS, nursing.sel, nursing.days);
    total += getSimpleVal(VISIT_BATH_OPTIONS, bath.sel, bath.days);
    total += getSimpleVal(DAY_CARE_OPTIONS, dayCare.sel, dayCare.days);
    total += getSimpleVal(DEMENTIA_DAY_CARE_OPTIONS, dementiaDayCare.sel, dementiaDayCare.days);
    total += getSimpleVal(SHORT_CARE_OPTIONS, shortCare.sel, shortCare.days);
    const over = Math.max(0, total - monthlyLimit);
    const base = Math.min(total, monthlyLimit);
    const selfPay = recipientRate !== null ? Math.round(base * recipientRate) + over : null;
    const publicPay = recipientRate !== null ? base - Math.round(base * recipientRate) : null;
    setResult({ totalBenefitCost: total, overLimit: over, selfPay, publicPay });
  };

  const selStyle = { width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 4, fontSize: 13, background: "#fff", cursor: "pointer", fontFamily: "'Noto Sans KR',sans-serif" };
  const disStyle = { ...selStyle, background: "#f5f5f5", color: "#aaa", cursor: "not-allowed" };
  const thStyle = { padding: "10px 12px", background: "#f0faf5", color: "#1D9E75", fontSize: 13, fontWeight: 600, borderBottom: "1px solid #e8f5ee", textAlign: "left" };
  const tdLabelStyle = { padding: "12px", fontSize: 13, fontWeight: 600, color: "#444", background: "#fafafa", borderRight: "1px solid #eee", width: 100, verticalAlign: "top" };

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontSize: 20, fontWeight: 600, color: "#222", marginBottom: 4 }}>재가급여 간편 계산</h1>
        <p style={{ fontSize: 13, color: "#888" }}>2026년 수가 기준 · 국민건강보험공단 장기요양</p>
      </div>

      {/* 등급 + 수급자유형 */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 13, color: "#555", marginBottom: 6, fontWeight: 500 }}>장기요양 등급</div>
          <select style={selStyle} value={grade} onChange={e => setGrade(e.target.value)}>
            <option>선택</option>
            {Object.keys(MONTHLY_LIMITS).map(g => (
              <option key={g} value={g}>{g} (월한도 {fmt(MONTHLY_LIMITS[g])}원)</option>
            ))}
          </select>
        </div>
        <div>
          <div style={{ fontSize: 13, color: "#555", marginBottom: 6, fontWeight: 500 }}>수급자 유형</div>
          <select style={selStyle} value={recipientType} onChange={e => setRecipientType(e.target.value)}>
            {RECIPIENT_TYPES.map(r => <option key={r.label}>{r.label}</option>)}
          </select>
        </div>
      </div>

      {/* 월한도액 표시 */}
      {grade !== "선택" && (
        <div style={{ background: "#f0faf5", border: "1px solid #c8e6c9", borderRadius: 6, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: "#1D9E75", fontWeight: 600 }}>
          📌 {grade} 월 한도액: {fmt(monthlyLimit)}원
        </div>
      )}

      {/* 서비스 테이블 */}
      <div style={{ overflowX: "auto", marginBottom: 16 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", border: "1px solid #eee", fontSize: 13 }}>
          <thead>
            <tr>
              <th style={thStyle}>서비스 유형</th>
              <th style={thStyle}>서비스 이용구간</th>
              <th style={thStyle}>이용횟수</th>
              <th style={{ ...thStyle, textAlign: "right" }}>급여비용</th>
            </tr>
          </thead>
          <tbody>
            {/* 방문요양 */}
            {visitRows.map((row, idx) => {
              const subTotals = [1, 2, 3].map(n => {
                const sel = row[`sel${n}`]; const days = row[`days${n}`];
                return (sel !== "선택" && days !== "선택") ? getVal(VISIT_CARE_OPTIONS, sel) * Number(days) : 0;
              });
              const rowTotal = subTotals.reduce((a, b) => a + b, 0);
              return (
                <tr key={idx} style={{ borderTop: idx === 0 ? "none" : "1px solid #eee" }}>
                  {idx === 0 && <td rowSpan={3} style={tdLabelStyle}>방문요양<br /><span style={{ fontSize: 11, color: "#aaa", fontWeight: 400 }}>1일 방문횟수</span></td>}
                  <td style={{ padding: 12, background: "#fafafa", borderRight: "1px solid #eee", fontSize: 13, fontWeight: 500 }}>{row.count}</td>
                  <td style={{ padding: 12 }}>
                    {[1, 2, 3].map(n => (
                      <div key={n} style={{ display: "flex", gap: 6, marginBottom: n < 3 ? 6 : 0 }}>

                          {VISIT_CARE_OPTIONS.map((o, i) => <option key={i} value={o.label}>{o.label}</option>)}

                          {DAYS_OPTIONS.map((d, i) => <option key={i} value={d}>{d === "선택" ? "횟수" : d + "회"}</option>)}

                      </div>

                    <div style={{ textAlign: "right", fontSize: 13, fontWeight: 600, color: "#222", marginTop: 6 }}>
                      소계: {rowTotal > 0 ? fmt(rowTotal) + "원" : "-"}

                  </div>
                </td>

                <div style={{ fontSize: 11, color: "#e53935", marginTop: 6 }}>

                </div>
              </td>
              <td style={{ padding: "12px 14px 12px 0", textAlign: "right", fontSize: 13, fontWeight: 600 }}>
                {shortCare.sel !== "선택" && shortCare.days !== "선택" ? fmt(getSimpleVal(SHORT_CARE_OPTIONS, shortCare.sel, shortCare.days)) + "원" : "-"}

          </tbody>

      </div>

          </button>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, flex: 1 }}>
            {[
              { label: "총급여비용", value: result ? fmt(result.totalBenefitCost) + "원" : "" },
              { label: "한도초과금액", value: result ? fmt(result.overLimit) + "원" : "" },

          </div>
        )}
        <div style={{ fontSize: 12, color: "#888", marginTop: 10 }}>
          ※ 본인부담금 = 한도액 내 급여비용 × 본인부담률 + 한도초과금액
        </div>
      </div>

      {/* 유의사항 */}
      <div style={{ background: "#fff8e1", border: "1px solid #ffe082", borderRadius: 8, padding: 16, fontSize: 12, color: "#5d4037", lineHeight: 1.8 }}>
        <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>재가급여 간편 계산 유의사항</div>
        <ul style={{ paddingLeft: 18, margin: "0 0 8px" }}>
          <li>재가급여는 등급별 월 한도액 범위 내에서 이용하여야 하며, 초과 비용은 전액 본인 부담입니다.</li>
          <li>야간·일요일·공휴일 이용 시 급여비용 가산이 적용되어 본인부담금이 증가될 수 있습니다.</li>
          <li>주야간보호·단기보호는 식사재료비, 이·미용비 등 비급여 항목이 별도로 발생합니다.</li>
          <li>주야간보호를 월 15일(1일 8시간 이상) 이상 이용 시 월 한도액 20% 범위 내 추가 산정 가능합니다.</li>
        </ul>
        <div style={{ fontSize: 11, color: "#888" }}>※ 본 계산기는 2026년 수가 기준 간편 계산이며, 실제 비용과 차이가 있을 수 있습니다.</div>
      </div>
    </div>
  );
}

// ===================== 등급예상 점수 계산기 =====================
function GradeCalc() {
  const categories = [
    { cat: "신체기능", items: [
      { name: "혼자 옷 벗고 입기 어려움", score: 5.5 },
      { name: "혼자 세수하기 어려움", score: 3.5 },
      { name: "혼자 목욕하기 어려움", score: 7.5 },
      { name: "혼자 식사하기 어려움", score: 8.5 },
      { name: "혼자 체위변경 어려움", score: 9.5 },
      { name: "혼자 일어나 앉기 어려움", score: 7.0 },
      { name: "혼자 옮겨 앉기 어려움", score: 8.0 },
      { name: "화장실 사용 어려움", score: 8.5 },
      { name: "대변 조절 어려움", score: 9.0 },
      { name: "소변 조절 어려움", score: 8.0 },
    ]},
    { cat: "인지기능", items: [
      { name: "단기 기억장애", score: 6.5 },
      { name: "날짜/요일 모름", score: 5.0 },
      { name: "장소 파악 어려움", score: 6.0 },
      { name: "지시 이해 어려움", score: 7.0 },
      { name: "의사소통 어려움", score: 7.5 },
    ]},
    { cat: "행동변화", items: [
      { name: "망상/환각 증상", score: 5.0 },
      { name: "서성거림/배회", score: 4.5 },
      { name: "수면장애", score: 3.5 },
      { name: "도움에 저항", score: 4.0 },
      { name: "폭언/폭력 행동", score: 5.5 },
    ]},
    { cat: "간호처치", items: [
      { name: "욕창 간호 필요", score: 9.0 },
      { name: "경관영양 필요", score: 8.5 },
      { name: "산소요법 필요", score: 8.0 },
      { name: "흡인 필요", score: 9.5 },
    ]},
  ];

  const [checked, setChecked] = useState({});
  const toggle = (key) => setChecked(prev => ({ ...prev, [key]: !prev[key] }));
  const total = Object.entries(checked).filter(([, v]) => v).reduce((sum, [k]) => {
    for (const cat of categories) {
      const item = cat.items.find((_, i) => `${cat.cat}-${i}` === k);
      if (item) return sum + item.score;
    }
    return sum;
  }, 0);

  const getGrade = (score) => {
    if (score >= 95) return { grade: "1등급", color: "#e53935", desc: "최중증으로 시설·재가급여 모두 이용 가능" };
    if (score >= 75) return { grade: "2등급", color: "#e53935", desc: "중증으로 시설·재가급여 모두 이용 가능" };
    if (score >= 60) return { grade: "3등급", color: "#fb8c00", desc: "중등증으로 재가급여 이용 가능" };
    if (score >= 51) return { grade: "4등급", color: "#fb8c00", desc: "경증으로 재가급여 이용 가능" };
    if (score >= 45) return { grade: "5등급", color: "#1D9E75", desc: "치매진단 필요, 인지지원 서비스 이용 가능" };
    return { grade: "등급외", color: "#888", desc: "장기요양 대상이 아닙니다" };
  };

  const gradeInfo = getGrade(Math.min(total, 100));

  return (
    <div>
      <div style={{ marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 600, color: "#222", marginBottom: 4 }}>장기요양등급 예상점수 계산</h1>
        <p style={{ fontSize: 13, color: "#888" }}>주요 항목 체크 → 예상 등급 확인 (참고용)</p>
      </div>
      <div style={{ background: "#fff3cd", border: "1px solid #ffe082", borderRadius: 6, padding: "10px 14px", marginBottom: 16, fontSize: 12, color: "#856404" }}>
        ⚠️ 이 계산기는 참고용입니다. 실제 등급은 공단 조사원의 방문조사(52개 항목)로 결정됩니다.
      </div>

      {/* 결과 고정 표시 */}
      <div style={{ background: gradeInfo.grade === "등급외" ? "#f5f5f5" : "#1D9E75", borderRadius: 8, padding: 16, marginBottom: 20, display: "flex", alignItems: "center", gap: 20 }}>
        <div style={{ textAlign: "center", minWidth: 80 }}>
          <div style={{ fontSize: 12, color: gradeInfo.grade === "등급외" ? "#888" : "rgba(255,255,255,0.8)", marginBottom: 4 }}>예상 점수</div>
          <div style={{ fontSize: 32, fontWeight: 600, color: gradeInfo.grade === "등급외" ? "#888" : "#fff" }}>{Math.min(total, 100).toFixed(1)}</div>
          <div style={{ fontSize: 12, color: gradeInfo.grade === "등급외" ? "#888" : "rgba(255,255,255,0.7)" }}>점</div>
        </div>
        <div style={{ width: 1, height: 60, background: "rgba(255,255,255,0.3)" }}></div>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: gradeInfo.grade === "등급외" ? "#888" : "#fff", marginBottom: 4 }}>{gradeInfo.grade} 예상</div>
          <div style={{ fontSize: 13, color: gradeInfo.grade === "등급외" ? "#aaa" : "rgba(255,255,255,0.85)" }}>{gradeInfo.desc}</div>
        </div>
      </div>

      {categories.map(cat => (
        <div key={cat.cat} style={{ marginBottom: 16, border: "1px solid #eee", borderRadius: 8, overflow: "hidden" }}>
          <div style={{ background: "#f0faf5", padding: "10px 14px", fontSize: 14, fontWeight: 600, color: "#1D9E75", borderBottom: "1px solid #eee" }}>{cat.cat}</div>
          <div style={{ padding: "8px 14px" }}>
            {cat.items.map((item, i) => {
              const key = `${cat.cat}-${i}`;
              return (
                <label key={key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", fontSize: 14, color: "#333", cursor: "pointer", borderBottom: i < cat.items.length - 1 ? "1px solid #f5f5f5" : "none" }}>
                  <input type="checkbox" checked={!!checked[key]} onChange={() => toggle(key)} style={{ width: 16, height: 16, accentColor: "#1D9E75", cursor: "pointer" }} />
                  <span style={{ flex: 1 }}>{item.name}</span>
                  <span style={{ fontSize: 12, color: "#aaa" }}>+{item.score}점</span>
                </label>
              );
            })}
          </div>
        </div>
      ))}

      <div style={{ background: "#f0faf5", border: "1px solid #c8e6c9", borderRadius: 8, padding: 14, fontSize: 12, color: "#555", lineHeight: 1.8, marginTop: 8 }}>
        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6, color: "#1D9E75" }}>등급 기준표</div>
        {[
          { grade: "1등급", range: "95점 이상", color: "#e53935" },
          { grade: "2등급", range: "75점 이상~95점 미만", color: "#e53935" },
          { grade: "3등급", range: "60점 이상~75점 미만", color: "#fb8c00" },
          { grade: "4등급", range: "51점 이상~60점 미만", color: "#fb8c00" },
          { grade: "5등급", range: "45점 이상 (치매 진단 필요)", color: "#1D9E75" },
          { grade: "등급외", range: "45점 미만", color: "#888" },
        ].map(({ grade, range, color }) => (
          <div key={grade} style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <span style={{ display: "inline-block", background: color, color: "#fff", fontSize: 11, padding: "1px 7px", borderRadius: 10, minWidth: 50, textAlign: "center" }}>{grade}</span>
            <span>{range}</span>
          </div>
        ))}
        <div style={{ marginTop: 8, fontSize: 11, color: "#888" }}>* 신청 방법: 공단 지사 방문 또는 온라인(longtermcare.or.kr) 신청</div>
      </div>
    </div>
  );
}

// ===================== 메인 앱 =====================
function CalcApp() {
  const [current, setCurrent] = useState("재가급여");
  window.showCalc = (type) => {
    setCurrent(type);
    document.querySelectorAll(".calc-menu-item").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".calc-menu-item").forEach(b => {
      if (b.textContent.includes(type === "재가급여" ? "재가" : type === "시설급여" ? "시설" : "등급")) {
        b.classList.add("active");
      }
    });
  };
  return (
    <div>
      {current === "재가급여" && <ReGaCalc />}
      {current === "시설급여" && <SiSeolCalc />}
      {current === "등급예상" && <GradeCalc />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("calc-root")).render(<CalcApp />);
</script>
</body>
</html>
