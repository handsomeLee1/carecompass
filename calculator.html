// ===================== 재가급여 계산기 =====================
function ReGaCalc() {
  const [grade, setGrade] = useState("선택");
  const [recipientType, setRecipientType] = useState("선택");
  const [visitCount, setVisitCount] = useState("1일 1회");
  const [visitRows, setVisitRows] = useState([
    { count: "1일 1회", sel1: "선택", sel2: "선택", sel3: "선택", days1: "선택", days2: "선택", days3: "선택" },
    { count: "1일 2회", sel1: "선택", sel2: "선택", sel3: "선택", days1: "선택", days2: "선택", days3: "선택" },
    { count: "1일 3회", sel1: "선택", sel2: "선택", sel3: "선택", days1: "선택", days2: "선택", days3: "선택" },
  ]);
  const [nursing, setNursing] = useState({ sel: "선택", days: "선택" });
  const [bath, setBath] = useState({ sel: "선택", days: "선택" });
  const [dayCare, setDayCare] = useState({ sel: "선택", days: "선택" });
  const [dementiaDayCare, setDementiaDayCare] = useState({ sel: "선택", days: "선택" });
  const [shortCare, setShortCare] = useState({ sel: "선택", days: "선택" });
  const [result, setResult] = useState(null);

  const monthlyLimit = MONTHLY_LIMITS[grade] || 0;
  const recipientRate = RECIPIENT_TYPES.find(r => r.label === recipientType)?.rate ?? null;

  const updateVisitRow = (idx, field, val) => {
    setVisitRows(prev => prev.map((r, i) => i === idx ? { ...r, [field]: val } : r));
  };

  const handleCalc = () => {
    let total = 0;
    visitRows.forEach(row => {
      [1, 2, 3].forEach(n => {
        const sel = row[`sel${n}`]; const days = row[`days${n}`];
        if (sel !== "선택" && days !== "선택") total += getVal(VISIT_CARE_OPTIONS, sel) * Number(days);
      });
    });
    total += getSimpleVal(VISIT_NURSING_OPTIONS, nursing.sel, nursing.days);
    total += getSimpleVal(VISIT_BATH_OPTIONS, bath.sel, bath.days);
    total += getSimpleVal(DAY_CARE_OPTIONS, dayCare.sel, dayCare.days);
    total += getSimpleVal(DEMENTIA_DAY_CARE_OPTIONS, dementiaDayCare.sel, dementiaDayCare.days);
    total += getSimpleVal(SHORT_CARE_OPTIONS, shortCare.sel, shortCare.days);
    const over = Math.max(0, total - monthlyLimit);
    const base = Math.min(total, monthlyLimit);
    const selfPay = recipientRate !== null ? Math.round(base * recipientRate) + over : null;
    const publicPay = recipientRate !== null ? base - Math.round(base * recipientRate) : null;
    setResult({ totalBenefitCost: total, overLimit: over, selfPay, publicPay });
  };

  const selStyle = { width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 4, fontSize: 13, background: "#fff", cursor: "pointer", fontFamily: "'Noto Sans KR',sans-serif" };

  const thStyle = { padding: "10px 12px", background: "#EEF2FF", color: "#5B5AE0", fontSize: 13, fontWeight: 600, borderBottom: "1px solid #DDD8FF", textAlign: "left" };

const DAYS_OPTIONS_FACILITY = ["선택", ...Array.from({ length: 31 }, (_, i) => String(i + 1))];

function SiSeolCalc() {
  const [facility, setFacility] = useState("");
  const [recipient, setRecipient] = useState("선택");
  const [grade, setGrade] = useState("선택");
  const [days, setDays] = useState("선택");
  const [result, setResult] = useState(null);

  const gradeOptions = facility && FACILITY_GRADES[facility]
    ? [{ label: "-선택-", value: 0 }, ...FACILITY_GRADES[facility]]
    : [{ label: "-선택-", value: 0 }];

  const handleFacilityChange = (val) => {
    setFacility(val);
    setGrade("선택");
    setResult(null);
  };

  const handleCalc = () => {
    if (!facility) { alert("시설을 선택해 주세요."); return; }
    if (recipient === "선택") { alert("수급자 유형을 선택해 주세요."); return; }
    if (grade === "선택" || grade === "-선택-") { alert("수급자 등급을 선택해 주세요."); return; }
    if (days === "선택") { alert("이용일수를 선택해 주세요."); return; }
    const dailyRate = gradeOptions.find(g => g.label === grade)?.value || 0;
    const daysNum = parseInt(days);
    const rate = RECIPIENT_FACILITY.find(r => r.label === recipient)?.rate ?? 0;
    const total = dailyRate * daysNum;
    const selfPay = Math.floor(total * rate);
    const publicPay = Math.ceil(total * (1 - rate));
    setResult({ total, selfPay, publicPay });
  };

  const selStyle = { width: "100%", padding: "8px 10px", border: "1px solid #ddd", borderRadius: 4, fontSize: 13, background: "#fff", fontFamily: "'Noto Sans KR',sans-serif", cursor: "pointer" };

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontSize: 20, fontWeight: 600, color: "#222", marginBottom: 4 }}>시설급여 간편 계산</h1>
        <p style={{ fontSize: 13, color: "#888" }}>2026년 수가 기준 · 노인요양시설 입소 비용</p>
      </div>

      {/* 시설 선택 */}
      <div style={{ background: "#fff", border: "1px solid #eee", borderRadius: 8, padding: 16, marginBottom: 12 }}>

function GradeCalc() {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  const sections = ['physical','cognitive','behavior','nursingCare','rehab'];
  const sectionTitles = ['신체기능 (12항목)','인지기능 (7항목)','행동변화 (14항목)','간호처치 (9항목)','재활 (10항목)'];
  const sectionSubs = [
    '옷 입기, 식사, 이동 등 일상적 신체활동 능력을 평가합니다.',
    '기억력, 판단력, 의사소통 등 인지 능력을 평가합니다.',
    '문제행동 발생 여부를 평가합니다.',
    '전문 간호처치 필요 여부를 평가합니다.',
    '운동장애 및 관절제한 여부를 평가합니다.',
  ];
  const stepLabels = ['신체','인지','행동','간호','재활','결과'];

  const setAnswer = (id, val) => setAnswers(prev => ({...prev, [id]: val}));

  const isSectionDone = (secKey) => {
    return GRADE_ITEMS[secKey].every(item => answers[item.id] !== undefined);
  };

  const calcScores = () => {
    const a = answers;
    const pr = Object.keys(a).filter(k=>k.startsWith('p')).reduce((s,k)=>s+a[k],0);
    const cr = Object.keys(a).filter(k=>k.startsWith('c')).reduce((s,k)=>s+a[k],0);
    const br = Object.keys(a).filter(k=>k.startsWith('b')).reduce((s,k)=>s+a[k],0);
    const nr = Object.keys(a).filter(k=>k.startsWith('n')).reduce((s,k)=>s+a[k],0);
    const rr = Object.keys(a).filter(k=>k.startsWith('r')).reduce((s,k)=>s+a[k],0);
    const pc = CONV.phys[pr]||0;
    const cc = CONV.cog[cr]||0;
    const bc = CONV.beh[br]||0;
    const nc = CONV.nur[nr]||0;
    const rc = CONV.reh[rr]||0;
    return {pr,cr,br,nr,rr,pc,cc,bc,nc,rc};
  };

  const treeClean=(a,s)=>{const P=s.pc,C=s.cc,B=s.bc,R=s.rc;if(P<=34.15){if(P<=17.72){if(P<=6.59)return 1.2;if(C<=9.86)return 3.0;if(C<=39.21)return 2.9;return 4.1;}return a.c04===0?5.3:8.0;}if(a.p03<=2){if(a.p10===1)return 8.6;return a.c02===0?9.0:13.0;}if(a.p10===1)return 11.6;if(R<=40.16)return 16.4;return B<=60.34?15.4:19.6;};
  const treeExcrete=(a,s)=>{const B=s.bc;if(a.p06===1){if(a.p12===1){if(a.p01===1)return 0.9;if(a.c06===0){return a.c02===0?1.2:2.5;}return 1.2;}if(a.p12===2){if(a.p08===1){return B<=15.58?0.3:0.7;}if(B<=15.58){return a.r09===1?0.5:1.3;}return a.c02===0?1.2:2.5;}if(a.p10===1){return a.p02===1?9.0:15.0;}if(a.p11<=2)return 11.8;return 15.8;}if(a.p05===1){return a.p11<=2?5.3:10.2;}if(a.p02===1){return a.b09===0?8.8:12.5;}return a.b03===0?12.8:18.7;};
  const treeMeal=(a,s)=>{const P=s.pc,R=s.rc;if(a.p05<=2){if(a.p03<=2){if(a.p10===1){return P<=6.59?7.1:9.4;}return a.p11<=2?11.5:15.1;}if(a.b09===0){if(a.p11<=2){return a.p10===1?12.2:13.9;}return R<=30.77?14.3:21.4;}return 23.4;}return R<=41.21?31.7:37.6;};
  const treeFunc=(a,s)=>{const P=s.pc,B=s.bc;if(P<=47.64){if(P<=25.14){return P<=6.59?1.2:2.7;}if(a.p03===1){return a.r03===1?3.6:6.0;}if(a.p10<=2){return B<=28.83?6.4:9.3;}return a.p07===1?4.9:7.8;}if(a.p03<=2){if(a.p10<=2){return B<=28.83?6.4:9.3;}return 14.0;}if(a.n04===0){return a.b11===0?4.3:6.8;}return 18.7;};
  const treeBeh=(a,s)=>{if(s.bc<=34.69){if(s.bc<=7.79)return s.pc<=17.71?0.6:0.4;return s.cc<=60.24?0.9:1.3;}if(s.cc<=39.21)return a.b09===0?1.6:2.6;return a.p02<=2?2.2:3.2;};
  const treeIndirect=(a,s)=>{if(s.pc<=25.14)return s.pc<=6.59?12.5:16.9;if(a.b09===0){if(a.p12===1)return s.bc<=56.0?17.3:21.0;return a.p05===1?19.7:23.6;}if(a.b03===0)return a.b04===0?19.8:23.0;return 28.4;};
  const treeNursing=(a,s)=>{if(a.n04===0){if(s.nc===0){return a.b04===0?7.6:9.7;}if(s.nc<=19.84){return a.p03<=2?9.6:14.7;}return 14.6;}if(a.p05<=2){if(a.p03<=2){return a.b07===0?6.7:8.1;}return a.r02===1?9.5:7.1;}return 22.5;};
  const treeRehab=(a,s)=>{const R=s.rc;if(R===0){return a.b07===0?2.5:3.7;}if(R<=39.46){if(a.p02<=2){return a.p08===1?2.1:4.2;}if(a.p07===1)return 4.8;return a.p03===1?4.0:5.7;}if(a.b03===0){if(a.p02<=2)return 3.2;return 4.8;}if(a.p02===1)return 4.1;return 6.3;};

  const getGrade=(t)=>{
    if(t>=95)return{g:'1등급',d:'전적으로 다른 사람의 도움이 필요',color:'#dc2626'};
    if(t>=75)return{g:'2등급',d:'상당 부분 다른 사람의 도움이 필요',color:'#ea580c'};
    if(t>=60)return{g:'3등급',d:'부분적으로 다른 사람의 도움이 필요',color:'#d97706'};
    if(t>=51)return{g:'4등급',d:'일정 부분 다른 사람의 도움이 필요',color:'#16a34a'};
    if(t>=45)return{g:'5등급',d:'치매환자(노인성 질병)',color:'#5B5AE0'};
    return{g:'인지지원등급',d:'치매환자(노인성 질병)',color:'#888'};
  };

  const handleCalc = () => {
    const s = calcScores();
    const a = answers;
    const t1=treeClean(a,s),t2=treeExcrete(a,s),t3=treeMeal(a,s),t4=treeFunc(a,s);
    const t5=treeBeh(a,s),t6=treeIndirect(a,s),t7=treeNursing(a,s),t8=treeRehab(a,s);
    const rawTot=Math.round((t1+t2+t3+t4+t5+t6+t7+t8)*10)/10;
    const tot=Math.min(rawTot,95);
    const totDisplay=rawTot>95?'95점 이상 (1등급)':tot+'점';
    setResult({s,tot,totDisplay,rawTot,services:[
      {n:'① 청결',v:t1},{n:'② 배설',v:t2},{n:'③ 식사',v:t3},{n:'④ 기능보조',v:t4},
      {n:'⑤ 행동변화대응',v:t5},{n:'⑥ 간접지원',v:t6},{n:'⑦ 간호처치',v:t7},{n:'⑧ 재활훈련',v:t8}
    ]});
    setStep(5);
  };

  const thStyle={padding:'9px 8px',background:'#EEF2FF',color:'#5B5AE0',fontSize:12,fontWeight:600,borderBottom:'1px solid #DDD8FF',textAlign:'center'};
  const tdStyle={padding:'10px 8px',borderBottom:'1px solid #f5f5f5',fontSize:13,textAlign:'center'};

  if(step===5 && result){
    const gr=getGrade(result.tot);
    return(
      <div>
        <div style={{background:'linear-gradient(135deg,#0c2340,#5B5AE0)',borderRadius:12,padding:28,textAlign:'center',marginBottom:16,color:'#fff'}}>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.7)',marginBottom:6}}>장기요양인정 예상점수</div>
          <div style={{fontSize:result.rawTot>95?36:52,fontWeight:800,letterSpacing:-2}}>{result.totDisplay}</div>
          <div style={{display:'inline-block',background:'rgba(255,255,255,0.2)',padding:'6px 20px',borderRadius:20,fontSize:14,fontWeight:700,marginTop:8}}>{gr.g}</div>
        </div>

        <div style={{background:'#fff',border:'1px solid #eee',borderRadius:8,padding:16,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:600,color:'#222',marginBottom:10}}>서비스군별 분석 결과</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr><th style={thStyle}>서비스군</th><th style={{...thStyle,textAlign:'right'}}>점수</th></tr></thead>
            <tbody>
              {result.services.map(x=>(
                <tr key={x.n}><td style={{...tdStyle,textAlign:'left'}}>{x.n}</td><td style={{...tdStyle,textAlign:'right',fontWeight:600}}>{x.v.toFixed(1)}점</td></tr>
              ))}
              <tr style={{background:'#EEF2FF'}}>
                <td style={{...tdStyle,fontWeight:700,color:'#5B5AE0'}}>합계</td>
                <td style={{...tdStyle,fontWeight:700,color:'#5B5AE0',textAlign:'right'}}>{result.tot}점</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div style={{background:'#fff',border:'1px solid #eee',borderRadius:8,padding:16,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:600,color:'#222',marginBottom:10}}>영역별 환산점수</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr><th style={thStyle}>영역</th><th style={{...thStyle,textAlign:'center'}}>원점수</th><th style={{...thStyle,textAlign:'right'}}>환산점수</th></tr></thead>
            <tbody>
              {[
                {n:'신체기능',r:result.s.pr,c:result.s.pc},
                {n:'인지기능',r:result.s.cr,c:result.s.cc},
                {n:'행동변화',r:result.s.br,c:result.s.bc},
                {n:'간호처치',r:result.s.nr,c:result.s.nc},
                {n:'재활',r:result.s.rr,c:result.s.rc},
              ].map(x=>(
                <tr key={x.n}><td style={{...tdStyle,textAlign:'left'}}>{x.n}</td><td style={tdStyle}>{x.r}점</td><td style={{...tdStyle,textAlign:'right',fontWeight:600}}>{x.c.toFixed(2)}점</td></tr>
              ))}
            </tbody>
          </table>
        </div>

        <div style={{background:'#fff',border:'1px solid #eee',borderRadius:8,padding:16,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:600,color:'#222',marginBottom:10}}>등급판정 기준표</div>
          {[
            {g:'1등급',range:'95점 이상'},{g:'2등급',range:'75점 ~ 94.9점'},
            {g:'3등급',range:'60점 ~ 74.9점'},{g:'4등급',range:'51점 ~ 59.9점'},
            {g:'5등급',range:'45점 ~ 50.9점'},{g:'인지지원등급',range:'45점 미만'},
          ].map(({g,range})=>(
            <div key={g} style={{display:'flex',justifyContent:'space-between',padding:'8px 12px',borderRadius:6,marginBottom:4,background:result.tot>=0&&gr.g===g?'#5B5AE0':'#f8f8f8',color:gr.g===g?'#fff':'#888',fontWeight:gr.g===g?700:400,fontSize:13}}>
              <span>{g}</span><span>{range}</span>
            </div>
          ))}
        </div>

        <div style={{background:'#fff8e1',border:'1px solid #ffe082',borderRadius:8,padding:14,fontSize:12,color:'#5d4037',lineHeight:1.8,marginBottom:16}}>
          <strong>⚠️ 유의사항</strong><br/>
          본 계산기는 보건복지부고시 수형분석 알고리즘 기반 <strong>예상 점수</strong>이며, 실제 결과와 다를 수 있습니다.<br/>
          실제 등급은 국민건강보험공단 방문조사 및 등급판정위원회 심의를 거쳐 최종 결정됩니다.
        </div>

        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button onClick={()=>{setStep(0);setAnswers({});setResult(null);}} style={{padding:'10px 20px',background:'#f5f5f5',border:'1px solid #ddd',borderRadius:6,fontSize:13,cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif"}}>← 처음부터</button>
          <button onClick={()=>setStep(4)} style={{padding:'10px 20px',background:'#5B5AE0',color:'#fff',border:'none',borderRadius:6,fontSize:13,cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif"}}>수정하기</button>
        </div>
      </div>
    );
  }

  const currentSec = sections[step];
  const currentItems = GRADE_ITEMS[currentSec];

  return(
    <div>
      <div style={{marginBottom:16}}>
        <h1 style={{fontSize:20,fontWeight:600,color:'#222',marginBottom:4}}>장기요양등급 예상점수 계산</h1>
        <p style={{fontSize:13,color:'#888'}}>보건복지부고시 기준 수형분석 알고리즘 적용</p>
      </div>

      {/* 진행 단계 */}
      <div style={{display:'flex',alignItems:'center',marginBottom:20}}>
        {stepLabels.map((label,i)=>(
          <React.Fragment key={i}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:i<step?'#5B5AE0':i===step?'#0c2340':'#ddd',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>
                {i<step?'✓':i+1}
              </div>
              <div style={{fontSize:10,marginTop:4,color:i===step?'#0c2340':i<step?'#5B5AE0':'#aaa',fontWeight:i===step?700:400}}>{label}</div>
            </div>
            {i<5&&<div style={{flex:1,height:3,background:i<step?'#5B5AE0':'#ddd',marginTop:-14}}></div>}
          </React.Fragment>
        ))}
      </div>

      {/* 항목 테이블 */}
      <div style={{background:'#fff',border:'1px solid #eee',borderRadius:8,padding:16,marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:600,color:'#0c2340',marginBottom:4}}>{sectionTitles[step]}</div>
        <div style={{fontSize:12,color:'#888',marginBottom:14}}>{sectionSubs[step]}</div>

        {currentSec==='rehab'?(
          <>
            <div style={{fontSize:12,fontWeight:700,color:'#5B5AE0',marginBottom:8,paddingBottom:6,borderBottom:'1px solid #eee'}}>운동장애 (4항목)</div>
            <table style={{width:'100%',borderCollapse:'collapse',marginBottom:16}}>
              <thead><tr>
                <th style={{...thStyle,textAlign:'left'}}>항목</th>
                {GRADE_ITEMS.rehab[0].opts.map(o=><th key={o} style={thStyle}>{o}</th>)}
              </tr></thead>
              <tbody>
                {GRADE_ITEMS.rehab.slice(0,4).map((item,i)=>(
                  <tr key={item.id} style={{background:i%2===0?'#fff':'#fafafa'}}>
                    <td style={{...tdStyle,textAlign:'left',fontWeight:500}}>{i+1}. {item.name}</td>
                    {item.opts.map((o,oi)=>(
                      <td key={o} style={tdStyle}>
                        <input type="radio" name={item.id} value={oi+1} checked={answers[item.id]===oi+1} onChange={()=>setAnswer(item.id,oi+1)} style={{width:18,height:18,accentColor:'#5B5AE0',cursor:'pointer'}}/>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{fontSize:12,fontWeight:700,color:'#5B5AE0',marginBottom:8,paddingBottom:6,borderBottom:'1px solid #eee'}}>관절제한 (6항목)</div>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr>
                <th style={{...thStyle,textAlign:'left'}}>항목</th>
                {GRADE_ITEMS.rehab[4].opts.map(o=><th key={o} style={thStyle}>{o}</th>)}
              </tr></thead>
              <tbody>
                {GRADE_ITEMS.rehab.slice(4).map((item,i)=>(
                  <tr key={item.id} style={{background:i%2===0?'#fff':'#fafafa'}}>
                    <td style={{...tdStyle,textAlign:'left',fontWeight:500}}>{i+5}. {item.name}</td>
                    {item.opts.map((o,oi)=>(
                      <td key={o} style={tdStyle}>
                        <input type="radio" name={item.id} value={oi+1} checked={answers[item.id]===oi+1} onChange={()=>setAnswer(item.id,oi+1)} style={{width:18,height:18,accentColor:'#5B5AE0',cursor:'pointer'}}/>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </>
        ):(
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>
              <th style={{...thStyle,textAlign:'left'}}>항목</th>
              {currentItems[0].opts.map(o=><th key={o} style={thStyle}>{o}</th>)}
            </tr></thead>
            <tbody>
              {currentItems.map((item,i)=>(
                <tr key={item.id} style={{background:i%2===0?'#fff':'#fafafa'}}>
                  <td style={{...tdStyle,textAlign:'left',fontWeight:500}}>{i+1}. {item.name}</td>
                  {item.opts.map((o,oi)=>{
                    const v=(currentSec==='physical'||currentSec==='rehab')?oi+1:oi;
                    return(
                      <td key={o} style={tdStyle}>
                        <input type="radio" name={item.id} value={v} checked={answers[item.id]===v} onChange={()=>setAnswer(item.id,v)} style={{width:18,height:18,accentColor:'#5B5AE0',cursor:'pointer'}}/>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* 버튼 */}
      <div style={{display:'flex',gap:10,justifyContent:'center'}}>
        {step>0&&<button onClick={()=>setStep(step-1)} style={{padding:'12px 24px',background:'#f5f5f5',border:'1px solid #ddd',borderRadius:6,fontSize:13,cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif"}}>← 이전</button>}
        {step<4?(
          <button onClick={()=>{
            if(!isSectionDone(currentSec)){alert('모든 항목을 선택해주세요.');return;}
            setStep(step+1);
          }} style={{padding:'12px 24px',background:'#0c2340',color:'#fff',border:'none',borderRadius:6,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif"}}>다음 →</button>
        ):(
          <button onClick={()=>{
            if(!isSectionDone(currentSec)){alert('모든 항목을 선택해주세요.');return;}
            handleCalc();
          }} style={{padding:'12px 32px',background:'linear-gradient(135deg,#dc2626,#b91c1c)',color:'#fff',border:'none',borderRadius:6,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif"}}>🔍 예상점수 확인하기</button>
        )}
      </div>
    </div>
  );
}
function CalcApp() {
  const [current, setCurrent] = useState("재가급여");
  window.__calcSwitch = (type) => setCurrent(type);
  window.showCalc = (type) => {
    setCurrent(type);
    document.querySelectorAll(".calc-menu-item").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".calc-menu-item").forEach(b => {
      if (b.textContent.includes(type === "재가급여" ? "재가" : type === "시설급여" ? "시설" : "등급")) {
        b.classList.add("active");
      }
    });
  };
  return (
    <div>
      {current === "재가급여" && <ReGaCalc />}
      {current === "시설급여" && <SiSeolCalc />}
      {current === "등급예상" && <GradeCalc />}
    </div>
  );
}
function switchCalc(type) {
  document.querySelectorAll('.calc-tab-btn').forEach(b => b.classList.remove('active'));
  const tabBtn = document.getElementById('tab-' + type);
  if (tabBtn) tabBtn.classList.add('active');
  if (window.__calcSwitch) window.__calcSwitch(type);
  if (window.__widgetSetActive) window.__widgetSetActive(type);
}
ReactDOM.createRoot(document.getElementById("calc-root")).render(<CalcApp />);
setTimeout(function(){var t=new URLSearchParams(location.search).get('tab');if(t)switchCalc(t);},300);
</script>
<script src="/widget.js"></script>
</body>
</html>
